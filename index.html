<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>零信任云平台原型 v1.0.1</title>
<style>
:root {
  --bg: #f2f3f5;
  --panel: #fff;
  --line: #e5e6eb;
  --text: #1d2129;
  --sub: #4e5969;
  --muted: #86909c;
  --brand: #1664ff;
  --brand-soft: #e8f0ff;
  --ok: #00b42a;
  --ok-soft: #e8ffea;
  --warn: #ff7d00;
  --warn-soft: #fff7e8;
  --danger: #f53f3f;
  --danger-soft: #ffece8;
  --nav: 200px;
  --rail: 64px;
  --drawer: 480px;
  --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; font-family: var(--font); color: var(--text); background: #c9cdd4; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: var(--brand); text-decoration: none; }

.shell { position: relative; max-width: 1440px; height: 100vh; margin: 0 auto; display: grid; grid-template-rows: 48px 1fr; background: var(--bg); box-shadow: 0 0 0 1px #b0b4bc; }
.top { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
.logo { font-weight: 700; font-size: 15px; }
.search { flex: 1; max-width: 420px; margin: 0 auto; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: #f7f8fa; color: var(--muted); font-size: 13px; display: flex; align-items: center; padding: 0 12px; }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { height: 30px; padding: 0 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 12px; color: var(--sub); }
.seg.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.seg:hover { border-color: #b8d0ff; }
.sel-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.seg-select {
  height: 30px; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
  font-size: 12px; color: var(--text); cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 13px, calc(100% - 9px) 13px; background-size: 5px 5px; background-repeat: no-repeat;
}
.seg-select:hover, .seg-select:focus { border-color: var(--brand); outline: none; }
.logic-note {
  border: 1px solid var(--line); background: #f7f8fa; color: var(--muted); border-radius: 6px;
  padding: 8px 12px; font-size: 12px; line-height: 1.7;
}
.logic-note b { color: var(--sub); font-weight: 600; }
.logic-note > b:first-child { display: block; margin-bottom: 2px; }
.logic-note .ln { display: flex; align-items: flex-start; gap: 6px; }
.logic-note .ln .no { flex-shrink: 0; color: var(--sub); }
.logic-note .ln .tx { min-width: 0; flex: 1; word-break: break-word; }
.logic-note select { height: 24px; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
.logic-note .btn.link { font-size: 12px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.toolbar .l, .toolbar .r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl { height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: #fff; font-size: 13px; }
.pg-title { font-size: 15px; font-weight: 600; }
.perm-table td.l1 { font-weight: 600; background: #fafbfc; vertical-align: top; width: 140px; }
.perm-table td.l2 { width: 160px; color: var(--sub); }
.perm-table .ops { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.qmark { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 4px; border-radius: 50%; background: #e8edf5; color: #3d4d66; font-size: 12px; font-weight: 700; cursor: help; vertical-align: middle; }
.qmark-pop { display: none; position: absolute; left: 20px; top: -6px; z-index: 20; width: 220px; padding: 8px 10px; border-radius: 6px; background: #1f2430; color: #fff; font-size: 12px; font-weight: 400; line-height: 1.6; text-align: left; white-space: normal; }
.qmark:hover .qmark-pop, .qmark:focus .qmark-pop { display: block; }
.perm-table label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
.intro { max-width: 960px; margin: 0 auto; }
.intro .hero { padding: 28px; display: flex; gap: 20px; align-items: center; }
.intro .hero .app-ico { width: 56px; height: 56px; font-size: 18px; border-radius: 12px; flex-shrink: 0; }
.intro .hero h2 { font-size: 20px; margin-bottom: 6px; }
.intro .feat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #fff; }
.intro .feat b { display: block; font-size: 13px; margin-bottom: 4px; }
.intro .feat span { font-size: 12px; color: var(--muted); line-height: 1.6; }
.intro ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--sub); line-height: 1.9; }
.steps { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.steps .st { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 12px; color: var(--sub); }
.steps .st i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 11px; }
.steps .arrow { color: var(--muted); }

.body { position: relative; display: grid; grid-template-columns: var(--rail) 1fr; min-height: 0; }
.doc-view { display: none; position: absolute; top: 0; right: 0; bottom: 0; left: var(--rail); z-index: 6; background: #fff; grid-template-columns: 220px 1fr; min-height: 0; }
.shell.doc-on .doc-view { display: grid; }
.doc-toc { overflow: auto; border-right: 1px solid var(--line); background: #fafbfc; padding: 12px 8px 24px; }
.doc-toc .toc-title { font-size: 13px; font-weight: 600; padding: 4px 8px 10px; }
.doc-toc .toc-back { display: flex; align-items: center; justify-content: center; width: calc(100% - 16px); margin: 0 8px 12px; height: 30px; border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 6px; font-size: 12px; text-align: center; }
.doc-toc .toc-back:hover { background: var(--brand); color: #fff; filter: brightness(.96); }
.doc-toc button { display: block; width: 100%; text-align: left; border: 0; background: transparent; font-size: 12px; color: var(--sub); padding: 5px 8px; border-radius: 4px; line-height: 1.4; }
.doc-toc button.lv3 { padding-left: 16px; color: var(--muted); }
.doc-toc button:hover { background: #fff; color: var(--brand); }
.doc-article { overflow: auto; padding: 20px 28px 48px; }
.doc-article h1 { font-size: 22px; margin: 0 0 12px; }
.doc-article h2 { font-size: 18px; margin: 28px 0 10px; }
.doc-article h3 { font-size: 15px; margin: 22px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.doc-article h4 { font-size: 14px; margin: 16px 0 6px; }
.doc-article p { font-size: 13px; line-height: 1.75; margin: 8px 0; }
.doc-article ul, .doc-article ol { margin: 8px 0; padding-left: 22px; font-size: 13px; line-height: 1.75; }
.doc-article code { font-size: 12px; background: #f2f3f5; padding: 0 4px; border-radius: 3px; }
.doc-article img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.doc-article figure { margin: 12px 0; }
.doc-article figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.doc-article hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.ver-panel { position: absolute; top: 52px; right: 16px; width: 440px; max-height: calc(100vh - 80px); overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 30; padding: 14px 16px; }
.ver-item + .ver-item { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.ver-item ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: var(--sub); }
.rail { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; }
.av { width: 36px; height: 36px; border-radius: 50%; background: #94bfff; color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 8px; }
.rail button { width: 52px; border: 0; background: transparent; border-radius: 8px; padding: 8px 0; font-size: 11px; color: var(--sub); }
.rail button.on { background: var(--brand-soft); color: var(--brand); }

.workspace { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
.workspace.app-open { grid-template-columns: 0 1fr; }
.apps { background: #fff; border-right: 1px solid var(--line); overflow: auto; }
.workspace.app-open .apps { overflow: hidden; border: 0; }
.apps-hd { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.app-item { width: calc(100% - 16px); margin: 6px 8px; border: 0; background: transparent; border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 36px 1fr; gap: 10px; text-align: left; }
.app-item:hover { background: #f7f8fa; }
.app-ico { width: 36px; height: 36px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }

.zt { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.zt > .placeholder { flex: 1; }
.zt > .content { flex: 1; min-height: 0; }
.zt-bar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #fff; border-bottom: 1px solid var(--line); }
.net-banner { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #eef8f1; border-bottom: 1px solid #cfe8d6; color: #146c36; font-size: 13px; }
.net-banner span { flex: 1; }
.zt-bar b { font-size: 14px; }
.crumb { color: var(--muted); font-size: 12px; }
.page-tabs { display: flex; gap: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 0 8px; min-height: 36px; align-items: flex-end; overflow-x: auto; }
.page-tabs:empty { display: none; }
.ptab { height: 32px; padding: 0 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: transparent; color: var(--sub); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.ptab.on { background: var(--bg); border-color: var(--line); color: var(--text); font-weight: 600; }
.ptab .x { border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 14px; line-height: 1; }

.zt-main { display: grid; grid-template-columns: var(--nav) 1fr; grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
.side { background: #fff; border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
.side .g { font-size: 11px; color: var(--muted); margin: 10px 8px 4px; }
.side button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: var(--text); margin-bottom: 2px; }
.side button:hover { background: #f7f8fa; }
.side button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.side button.sub { padding-left: 20px; font-size: 12.5px; color: var(--sub); }
.side button.sub.on { color: var(--brand); }
.content { overflow: auto; padding: 14px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.card + .card, .stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
h1 { margin: 0; font-size: 18px; }
h2 { margin: 0; font-size: 14px; }
h3 { margin: 0; font-size: 14px; font-weight: 600; }
.muted { color: var(--muted); font-size: 12px; }
.sub { color: var(--sub); font-size: 13px; }

.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); font-size: 13px; }
.btn:hover { background: #f7f8fa; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(.96); }
.btn.danger { color: var(--danger); border-color: #fbc0c0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: transparent; color: var(--brand); padding: 0 4px; height: auto; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }

.tag { display: inline-flex; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; align-items: center; background: #f2f3f5; color: var(--sub); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--danger-soft); color: var(--danger); }
.tag.blue { background: var(--brand-soft); color: var(--brand); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; background: #fafbfc; }
tr:hover td { background: #fafbfc; }
td[contenteditable="true"]:focus { outline: 2px solid var(--brand-soft); background: #fff; }

.field { display: grid; gap: 6px; }
.field label { font-size: 12px; color: var(--sub); }
.field input, .field select, .field textarea {
  height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: #fff;
}
.field textarea { height: 72px; padding: 8px 10px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 1100px) { .grid4, .grid3 { grid-template-columns: 1fr 1fr; } }

.kpi { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; cursor: default; }
.kpi.clickable { cursor: pointer; }
.kpi.clickable:hover { border-color: #b8d0ff; box-shadow: 0 1px 4px rgba(22,100,255,.08); }
.kpi .l { font-size: 13px; color: var(--sub); font-weight: 500; }
.kpi .v { font-size: 28px; font-weight: 700; margin-top: 8px; letter-spacing: -.5px; }
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.kpi .hint a, .kpi .hint .btn.link { font-size: 12px; }

.wb-head { margin-bottom: 4px; }
.wb-head .greet { font-size: 13px; color: var(--muted); margin-top: 4px; }
.wb-alerts { padding: 0; overflow: hidden; }
.wb-alerts .ahd { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.wb-alerts table { margin: 0; }
.wb-alerts th { background: #fafbfc; }
.wb-alerts td { padding: 12px 14px; }
.alert-type { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.alert-type .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.alert-type.high { color: var(--danger); }
.alert-type.high .dot { background: var(--danger); }
.alert-type.mid { color: var(--warn); }
.alert-type.mid .dot { background: var(--warn); }

.session-tabs {
  display: flex; gap: 0; background: #fff; border: 1px solid var(--line);
  border-bottom: 0; border-radius: 8px 8px 0 0; padding: 0 8px; min-height: 36px;
  align-items: flex-end; overflow-x: auto;
}
.session-tabs .stab {
  height: 32px; padding: 0 12px; border: 1px solid transparent; border-bottom: 0;
  border-radius: 6px 6px 0 0; background: transparent; color: var(--sub); font-size: 12px;
  display: inline-flex; align-items: center; gap: 6px;
}
.session-tabs .stab.on { background: var(--bg); border-color: var(--line); color: var(--text); font-weight: 600; }
.session-tabs .stab .x { border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 14px; line-height: 1; }
.session-panel { border: 1px solid var(--line); border-radius: 0 0 8px 8px; background: #fff; padding: 14px; }
.session-empty {
  border: 1px dashed var(--line); border-radius: 8px; background: #fff;
  padding: 64px 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7;
}

.split { display: grid; grid-template-columns: 280px 1fr; gap: 12px; min-height: 420px; }
.box { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: auto; }
.box-hd { padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.tree button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 12px; font-size: 13px; }
.tree button:hover, .tree button.on { background: var(--brand-soft); color: var(--brand); }
.tree .chk { margin-right: 6px; }

.perm { font-size: 13px; }
.perm details { border-bottom: 1px solid var(--line); padding: 8px 0; }
.perm summary { cursor: pointer; font-weight: 600; }
.perm .l2 { margin: 8px 0 4px 18px; font-weight: 500; color: var(--sub); }
.perm .ops { margin-left: 36px; display: flex; flex-wrap: wrap; gap: 10px 16px; color: var(--sub); }
.perm label { display: inline-flex; align-items: center; gap: 6px; }

.banner { border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.banner.info { background: var(--brand-soft); color: #0e42d2; }
.banner.warn { background: var(--warn-soft); color: #a35400; }
.banner.ok { background: var(--ok-soft); color: #00801e; }

.inner-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.inner-tabs button { border: 0; background: transparent; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; }
.inner-tabs button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

.card-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.card-tabs button {
  border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 10px 16px;
  font-size: 13px; color: var(--sub); min-width: 96px; text-align: center;
}
.card-tabs button.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); font-weight: 600; }
.card-tabs button .n { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.card-tabs button.on .n { color: var(--brand); }

.tunnel-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  min-height: 40px;
}
.tunnel-bar .t-label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.tunnel-bar .t-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: #f7f8fa; white-space: nowrap;
}
.tunnel-bar .t-status.on { background: var(--ok-soft); color: #00801e; }
.tunnel-bar .t-status.off { background: var(--warn-soft); color: #a35400; }
.tunnel-bar .t-info { font-size: 12px; color: var(--muted); flex: 1; min-width: 160px; }
.tunnel-bar .t-actions { display: flex; gap: 8px; margin-left: auto; }
.tunnel-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.tunnel-dot.on { background: var(--ok); }
.tunnel-dot.warn { background: var(--warn); }

.term { background: #1d2129; color: #e5e6eb; border-radius: 8px; padding: 12px; min-height: 320px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.55; }
.term .dim { color: #86909c; }
.term .ok { color: #7be188; }
.term .bad { color: #f98981; }

.topo-canvas { min-height: 360px; border: 1px dashed var(--line); border-radius: 8px; background:
  linear-gradient(180deg, #fafbfc, #f2f3f5); padding: 24px; display: grid; place-items: center; }
.topo-nodes { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 720px; }
.topo-node { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 120px; text-align: center; font-size: 13px; }
.topo-node b { display: block; margin-bottom: 4px; }
.topo-node.vpc { border-color: var(--brand); }
.topo-node.host { border-color: var(--ok); }

/* Right drawer */
.drawer-mask {
  position: fixed; inset: 0; background: rgba(29,33,41,.35); z-index: 40;
  opacity: 0; visibility: hidden; transition: .2s;
}
.drawer-mask.open { opacity: 1; visibility: visible; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(var(--drawer), 92vw);
  background: #fff; z-index: 41; box-shadow: -8px 0 24px rgba(0,0,0,.08);
  transform: translateX(100%); transition: transform .25s ease; display: grid; grid-template-rows: 52px 1fr 56px;
}
.drawer.open { transform: translateX(0); }
.drawer.wide { width: min(560px, 94vw); }
.dsec { margin-top: 18px; }
.dsec:first-child { margin-top: 0; }
.dsec > .dl { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.dsec > .dl .req { color: var(--danger); }
.dsec > .dl .opt { font-weight: 400; font-size: 12px; color: var(--muted); }
.chk-list { display: flex; flex-wrap: wrap; gap: 8px 20px; }

**零信任云平台**

**产品需求说明书（PRD）**

# 1 产品简介

零信任云平台应用是HiBro的一个独立应用，以零信任为核心安全架构，用身份信息、访问环境及资源属性制定安全访问策略，统一管理内网资源，包括云资源的购买和维护，并提供审计日志以便事后溯源。

## 1.1 文档目的

本文档为零信任云平台的需求说明文档，本文档主要明确了产品需求场景、产品功能说明等，为业务方/UI设计师/研发人员/测试人员/清晰传达产品可以解决的问题、应用的场景以及操作流程，同时为项目团队成员提供一个明确的产品功能描述文档，以供详细接口设计和开发任务拆解。最终使各方对该产品需求达成共识。

## 1.2 术语定义

1. 零信任防护网络：进入内网资源的加密通道。未接入时，无法看到任何内网资源。
2. 应用权限：应用本身基于角色的操作权限，决定能不能看见、能不能点击。
3. 访问策略：用户访问内网资源的策略，与应用权限是两层概念。
4. 已授权资源：基于访问策略判断某个用户可以访问的资源。
5. 策略裁决：用当前启用的访问策略，对一次远程登录给出允许或拒绝。
6. 可信设备：把当前登录HiBro的终端认证为可接入内网的设备，未授信不能接入内网。
7. 云主机：通过各云厂商购买的虚拟服务器
8. VPC：云主机所在的隔离网络
9. 安全组：云主机上的一组出入站访问规则，用来决定哪些访问可以进出这台云主机
10. 弹性 IP：可以分配并关联到云主机的固定地址

# 6 零信任云平台功能描述

## 6.1 应用初始化（本次迭代不考虑）

下载、获取、开通向导、确认初始化、配置超级管理员和无权限说明是同一个功能模块，按应用所处状态依次出现。

| **用户场景** | 成员第一次从即时通讯进入应用；空间管理员负责把应用开通到可用 |
| --- | --- |
| **需求描述** | 先拿到客户端再获取应用。未初始化时由空间管理员确认，完成后只引导指定超级管理员。未入列成员看到无权限说明 |
| **优先级** | P2 |
| **输入/前置条件** | 成员能打开应用入口。确认初始化的操作者是空间管理员 |
| **功能描述** | 1. 未下载时展示介绍和「下载」。下载完成后提示可获取，按钮变为「获取」。<br>2. 点击获取后进入开通向导。向导展示四步：联系空间管理员、确认初始化、配置超级管理员、开始使用。<br>3. 其他成员停留在向导，不能自己初始化。空间管理员进入确认。选择稍后再说，回到开通向导。<br>4. 确认后进入初始化。过程中提示不要离开。中途关闭应用，下次仍需重新确认。<br>5. 完成后提示已完成初始化。菜单只保留「角色」「用户」，并引导到用户，指定超级管理员。在此之前不开放云资源、策略、远程和审计。<br>6. 应用已初始化、但当前账号不在用户列表时，展示无权限说明。不提供「通知管理员」。 |
| **输出/后置条件** | 1.下载成功后，「下载」按钮变为「获取」；点击获取后进入开通向导。<br>2.初始化完成后提示「应用已完成初始化」，菜单仅保留「角色」「用户」，并引导指定超级管理员；用户列表出现超级管理员后，该账号按超级管理员进入。 |
| **异常提示及处理** | · 尚未下载就点「获取」：「获取」按钮不可用，须先完成下载。<br>· 非空间管理员尝试确认初始化：提示「请联系空间管理员完成开通」，停留在开通向导。<br>· 初始化进行中提示「初始化过程请不要离开」；中途关闭应用：初始化中断，应用仍为未初始化，下次进入需空间管理员重新确认。<br>· 已初始化但账号不在用户列表：提示「你还没有使用权限，请联系管理员将你加入用户列表」，停留在说明页，不提供「通知管理员」。 |

## 6.2 零信任防护网络接入

### 6.2.1 零信任防护网络

| **用户场景** | 管理员/运维人员需要操作内网资源 |
| --- | --- |
| **需求描述** | 未接入前仅接入页，不可见功能模块 |
| **优先级** | P0 |
| **输入/前置条件** | 用户已加入应用 |
| **功能描述** | 已授权用户打开应用后，**先进入「接入零信任防护网络」页**；未接入成功前不进入带侧栏的功能壳（无侧栏、无工作台 / 资源等功能模块）。<br>接入页展示：用户授权状态、当前设备 ID / MAC、设备状态；按状态给出短操作：<br>1）未授权：提示联系管理员添加并授权。<br>2）已授权、尚无可信设备（首台）：「认证该设备」（用户手机确认即可）。<br>3）已授权、当前设备非可信：提交认证，等待超级管理员；可停留本页。<br>4）当前设备已可信：点「接入内网」，手机**签名认证**；成功后进入功能页。<br>5）另含凭证失效、网络不可用等异常态。<br>接入成功后才出现侧栏功能；顶栏提示在防护网络内安全使用，并提供「退出」。连续 1 小时无操作弹窗「您已 1 小时没有任何操作。即将自动退出零信任防护网络」，仅【取消（Ns）】，N 从 5 秒倒计时；超时自动退出，点取消则留页。 |
| **输出/后置条件** | 接入成功后进入带侧栏的功能壳，可按角色权限使用资源管理、网络与安全、远程访问等。<br>断开（主动退出或空闲满 1 小时且未取消自动退出）后回到接入页，功能模块不可见；进行中的远程会话一并结束。<br>空闲倒计时弹窗中点击【取消】则取消退出，留在当前页并保持接入。 |
| **异常提示及处理** | 未授权：提示联系管理员添加并授权。<br>凭证失效：提示重新进入应用后再接入。<br>网络不可用：提示「网络不可用，恢复后可接入」。<br>当前设备已吊销：可「重新发起认证」，状态回到待认证。<br>（补充）若从异常路径进入资源类页面：提示「为保障内网资源安全，需接入零信任防护网络后方可操作」；主路径下未接入时根本进不了这些页。 |

## 6.3 工作台

### 6.3.1 概览

| **用户场景** | 用户进入应用后先看当前应用整体状态 |
| --- | --- |
| **需求描述** | 用一页汇总资源、会话、可信设备、策略覆盖与近期告警 |
| **优先级** | P1 |
| **输入/前置条件** | 已接入零信任防护网络 |
| **功能描述** | 概览页仅在已接入零信任防护网络后可访问（未接入时主路径无法进入工作台）。<br>根据用户角色展示资源、活跃会话、可信设备、策略覆盖率，以及近 24 小时告警列表；每个信息块可跳转至对应功能页面。<br>告警可跳转告警日志继续查看。<br>浏览者可以看到资源、活跃会话、可信设备、策略覆盖率及24小时告警。 |
| **输出/后置条件** | 1、若用户角色=管理员/超级管理员/浏览者<br>1）资源=应用内录入的全部资源；<br>2）活跃会话=应用内所有用户正在进行的远程访问数，即远程会话窗口总数<br>3）可信设备=应用内已认证设备总数，不含待认证和已忽略<br>4）策略覆盖率=访问策略命中的资源总数 / 平台录入的资源总数<br>2、当用户角色=运维员<br>1）资源=自己已授权的资源总数；<br>2）活跃会话=自己已打开的远程会话总数<br>3）运维人员没有可信设备和策略覆盖率的数据查看权限 |
| **异常提示及处理** | - |

### 6.4.1 选择主机与发起访问

| **用户场景** | 运维人员进入一台有权限的主机做操作 |
| --- | --- |
| **需求描述** | 把接入、主机上的操作和离开收成一次访问 |
| **优先级** | P0 |
| **输入/前置条件** | 已接入防护网络；角色有远程权限；主机运行中；访问策略允许 |
| **功能描述** | 1.**已授权资源列表字段**：资源名称（附 IP）、镜像、可信设备 ID / MAC（同格）、状态、操作。管理员另有「会话中用户」。<br>1）状态：在线 / 离线；已建立会话标「会话中」；离线主机「远程访问」置灰；浏览者不进入本模块。<br>2）列表右上角按钮「远程会话(N)」；N 为当前账号已打开会话数；N=0 时置灰禁用；N>0 可点回会话页。<br>2.**操作-远程访问**：发起访问（含云主机列表的「远程访问」按钮）默认需手机端签名认证；已建立会话的资源在会话页切换不再签名。发起时同时核对应用权限、可信设备、访问策略和主机状态；用户上被取消的资源不能进入。<br>3.本用户在其他可信设备上已访问同一主机：列表展示该会话记录（用户 + 设备）；点「远程访问」时弹窗确认是否断开之前的会话；确认后断开原设备会话，再按签名认证在本设备建立会话；取消则不建立本设备会话。<br>4.**会话区**：展示当前主机 / IP / 在线状态，提供命令终端、文件系统两个互斥页签。<br>1）文件系统支持受控上传、下载，均记入访问日志。<br>2）访问进行中，主机上的操作记入这一次访问日志（脱敏需求后续迭代）。<br>5.**操作-断开**：断开为天然权限，不在角色权限中单列；会话页点「资源列表」**返回列表不断开**；仅点「断开」结束该主机会话。不因关闭会话页而断开。<br>6.其他用户占用资源时，管理员 / 超级管理员可「中断会话」（签名认证），日志中结束原因记为管理员强制。<br>7.结束时记录时间与原因：主动断开、连接断开、凭证失效、策略失效、设备吊销、管理员强制。不设会话空闲超时断开；防护网络 1 小时空闲退出见 6.1.1。<br>8.不经过本应用的直接 SSH、主机本地操作、定时任务，不记成人员的一次平台访问。 |
| **输出/后置条件** | 1.允许访问时建立会话，并在访问日志增加一行；结束后写入结束时间和原因。<br>2.返回资源列表时会话保持；主动断开或管理员中断后才结束会话。<br>3.管理员中断会话后，会话中用户恢复为「-」，状态回到在线或离线。 |
| **异常提示及处理** | 1.未接入防护网络：提示「为保障内网资源安全，需接入零信任防护网络后方可操作」，不建立会话。<br>2.无远程权限、策略不允许或资源已在用户上被取消：提示「当前账号无远程访问权限，请联系管理员」，不建立会话。<br>3.主机未运行或离线：提示「离线，不可远程访问」。<br>4.待审批主机：提示「等待超级管理员审批」，不建立会话。<br>5.访问中策略停用 / 删除、设备吊销或凭证失效：访问立即结束，结束原因分别记为策略失效、设备吊销、凭证失效。<br>6.连接断开或管理员强制结束：结束原因分别记为连接断开、管理员强制。<br>7.签名认证未在手机确认：不建立会话；中断会话时未确认，会话继续。 |

## 6.5 权限管理

### 6.5.1 角色

| **用户场景** | 管理员根据业务需求新建的角色，并配置应用操作权限及高风险操作 |
| --- | --- |
| **需求描述** | 角色管理、应用权限和高风险确认 |
| **优先级** | P0 |
| **输入/前置条件** | 当前用户角色为超级管理员或管理员 |
| **功能描述** | 1.**列表字段**：角色名、角色ID、角色描述、操作<br>1）默认角色为超级管理员、管理员、运维员、浏览者。<br>2）双击角色名可编辑：超级管理员和管理员不可编辑<br>2. **新建角色**：新建时填写角色名，角色描述（非必填项）<br>3.**操作**-权限：<br>1）超级管理员：应用权限与高风险操作二次确认全部禁用，不可编辑。管理员：应用权限只读，高风险操作仍可配置。其余默认角色可重新勾选功能权限并配置高风险确认。<br>2）高风险操作列表=已勾选权限和高风险操作清单的交集，可配置高危操作的二次确认动作：无、扫码确认、管理员审批。其中默认项：<br>a .高风险操作清单：角色-删除角色、角色-权限、用户-删除、访问策略-新增、访问策略-删除、可信设备-认证、可信设备-吊销、云主机-创建、云主机-远程访问、云主机-终止、安全组-编辑规则、安全组-删除、弹性 IP-释放<br>b.当角色为运维员，云主机-远程访问默认【扫码确认】；创建云主机、云主机-终止默认为【管理员审批】；其他默认无<br>c.当角色为管理员或超级管理员，访问策略-删除、云主机-创建、云主机-远程访问、云主机-终止默认【扫码确认】（超管仅展示默认值，不可改）<br>4. **操作**-删除：删除时需判断该角色下是否还有用户。不可删除超级管理员和管理员。 |
| **输出/后置条件** | 1. 保存成功后，在列表中新增该角色。删除成功后角色从列表消失。<br>2. 角色名为空，提示「请填写角色名」。<br>3. 角色名含特殊字符，提示「角色名不能包含特殊字符」。<br>4. 角色名重复，提示「角色名已存在」。<br>5. 角色下仍有用户，提示「当前角色有关联用户，不可删除」。 |

### 6.5.2 用户

| **用户场景** | 管理员决定谁能使用应用，以及个别资源是否对某人关闭 |
| --- | --- |
| **需求描述** | 添加成员、可为用户绑定多个角色，并允许在用户上收紧已授权资源 |
| **优先级** | P0 |
| **输入/前置条件** | 当前角色可进入权限管理；添加时有候选成员 |
| **功能描述** | **列表字段**：用户名、用户ID（同步 HiBro）、部门、岗位、角色、状态、最近登录、操作。角色支持**一对多**展示（如「运维员、浏览者」）。<br>**添加用户**：同步 HiBro 组织架构，勾选后同步到右侧待新增列表。<br>1）待新增字段：姓名、部门、角色（可多选）、权限冲突。<br>2）角色默认浏览者。所选角色的操作权限没有冲突时，权限冲突为「-」。冲突定义是一个角色有某操作权限、另一个角色没有。有冲突时该格为单选：并集、交集，默认并集。多角色的数据权限始终取并集。表头「权限冲突」用问号说明「多角色的数据权限取并集」。<br>**操作-访问策略**：展示该用户经访问策略得到的已授权资源；取消勾选后不可访问该资源，行仍保留；可配置可用系统用户名（星号表示可使用全部用户名）。可吊销该用户可信设备。单次有效时长为**数字输入 1–24**，旁侧单位「小时」。<br>**操作-修改角色**：角色可多选；权限冲突为单选，规则与添加用户相同。在职超级管理员行另有**转移**：选在职用户；转移后原超管变为管理员；接收人角色不受限，加上超级管理员角色（可保留原角色）。<br>**离职**：访问策略抽屉中授权资源与可信设备为空；可信设备列表中该用户相关设备默认已吊销。<br>**操作-删除用户**：超级管理员 / 管理员不可删除；删除为软删除。 |
| **输出/后置条件** | 添加或修改成功后，列表更新对应用户信息（含用户ID、多角色）。<br>取消某用户的资源后，该用户不能再对这台资源远程登录，若正在访问将立即被断开。<br>未勾选用户点击【确认添加】，提示「请先在左侧勾选要添加的用户」。<br>超管转移成功后，原超管为管理员，接收人具备超级管理员。 |

## 6.6 零信任策略

超级管理员和管理员可进入。运维员、浏览者不显示该菜单。

### 6.6.1 访问策略

| **用户场景** | 管理员想要根据用户更多维度判断能远程访问哪些资源 |
| --- | --- |
| **需求描述** | 用角色、资源标签和动作做访问裁决 |
| **优先级** | P0 |
| **输入/前置条件** | 已有角色；资源条件按标签选择 |
| **功能描述** | 1.**列表字段**：策略名称、适用角色、资源条件摘要、动作、状态、操作。<br>1）系统预置「管理员全量访问」适用超级管理员与管理员，带预置标记，不可编辑、不可删除；且预置策略永久有效。<br>2.**新增 / 编辑策略**：填写策略名称（工作区内唯一），至少选择一个适用角色，并添加资源条件；每个属性必须选择属性值，同一资源类型的条件合并在一张条件卡（属性之间且、属性值之间或）。<br>1）动作本阶段固定为「远程登录」（预置规则可为「全部」）。<br>2）有效期：可选开始 / 结束日期，到期自动停用；启用后默认 60 天。<br>3）**单次有效时长**：数字输入 1–24，单位小时。<br>3.**操作-启用 / 停用**：切换状态开关即改变裁决范围，启停需二次确认。<br>4.**操作-删除**：删除按高风险确认，默认签名认证。 |
| **输出/后置条件** | 1.保存成功后，策略出现在列表中，远程登录按启用中的策略裁决。<br>2.启停或删除成功后，列表状态即时更新。 |
| **异常提示及处理** | 1.保存校验不通过：未填名称提示「请填写策略名称」；未选角色提示「请至少选择一个适用角色」；没有资源条件提示「请添加资源条件」；属性未选值提示「请为每个属性选择属性值」，均不保存。<br>2.同一资源类型重复添加：合并到同一张条件卡，提示「同一资源类型已合并在一张卡」。<br>3.可选属性已全部添加：提示「已添加全部可选属性」。<br>4.编辑或删除系统预置规则：分别提示「系统预置规则不可编辑」「系统预置规则不可删除」。<br>5. 策略停用或删除后，原本仅靠该策略放行的访问不再允许，进行中的访问以策略失效结束。 |

### 6.6.2 可信设备

| **用户场景** | 管理员确认用户的哪台终端可以接入内网 |
| --- | --- |
| **需求描述** | 若用户登录应用的设备没有被认证为可信设备，不可接入内网，默认每人 限制3 台 |
| **优先级** | P0 |
| **输入/前置条件** | 用户已在应用中。超级管理员 / 管理员 / 运维员 / 浏览者均可进入可信设备菜单（数据范围见功能描述）。 |
| **功能描述** | 1.**列表字段**：所属用户、设备MAC、设备IP、设备 ID、状态、最近登录、操作。<br>1）状态：待认证 / 已认证 / 已忽略 / 已吊销；仅已认证设备可用于接入。列表按用户分组展示，同一用户多设备时首行显示用户名可折叠，默认全展开。<br>2.**操作-认证**：对待认证设备，超级管理员可认证 / 忽略，均需弹窗二次确认；认证通过后设备变为已认证。<br>3.**操作-忽略**：忽略待认证设备；忽略不等于已认证，设备保留在列表，可再次认证。<br>4.**操作-吊销**：已认证设备可吊销；吊销后该设备不能接入，列表状态为「已吊销」，操作列为「—」。若该设备上有进行中的访问，当设备被吊销，该访问会话会被立即断开，且退出整个零信任防护网络；若吊销的是当前登录设备，切断权限并回到接入页。<br>5.**已吊销后再认证**：用户从接入页再次发起认证后，该条设备状态由「已吊销」变为「待认证」，操作恢复为【认证】【忽略】，由超级管理员处理。<br>6.**操作-详情**：点设备 ID 进详情，查看设备信息与近一周登录时间。<br>7.同一用户最多 3 台已认证设备。<br>8.**数据权限**：超级管理员 / 管理员可见全员设备，并可认证 / 忽略 / 吊销；运维员 / 浏览者有菜单入口，仅可见自己的设备（已认证可吊销，待认证 / 已吊销 / 已忽略无操作）。 |
| **输出/后置条件** | 1.认证成功的设备进入已认证状态，并在应用日志留下记录。<br>2.忽略成功后状态为已忽略；吊销成功后状态为已吊销（无列表侧重新认证操作）。<br>3.用户再次从接入页发起认证后，原已吊销记录变为待认证；管理员可选认证或忽略。若吊销的是当前设备，用户回到接入页。 |
| **异常提示及处理** | 1.已有 3 台已认证设备仍要认证：提示「最多 3 个可信设备」，不新增（后期迭代做替换）。<br>2.认证失败：结果记入应用日志，设备保持待认证，可重新发起。<br>3.二次确认取消：不执行认证 / 忽略 / 吊销操作。 |

## 6.7 资源管理

### 6.7.1 云主机

| **用户场景** | 管理员或运维员查看、创建并远程使用云主机 |
| --- | --- |
| **需求描述** | 创建要经过确认或审批；未运行的主机不能远程 |
| **优先级** | P0 |
| **输入/前置条件** | 已接入防护网络。创建时使用默认地域和已有安全组 |
| **功能描述** | 1.**列表字段**：名称 / ID、云厂商、区域、状态、镜像、主机类型、IP、安全组、Agent、用途（环境）、业务线、创建时间、操作。<br>1）状态：运行中 / 已停止 / 待审批 / 终止待审批 / 已终止；<br>2)主机名可点击进详情。<br>3）筛选：云厂商、区域。先选云厂商，区域只列出该厂商的区域；未选云厂商时不能选区域。原型中的云厂商为演示数据：亚马逊云、阿里云、腾讯云，区域列表各不相同；现有资源默认在亚马逊云 / ap-east-1（香港）。<br>2.**新建云主机（创建页）**：先选择云厂商（默认亚马逊云），再选择该云厂商的区域（默认 ap-east-1 香港）；切换云厂商后，区域选项改为该厂商自己的区域。其余填写镜像与版本、实例类型、网络 / VPC（默认且只读）、安全组（只能选已有）、存储卷、云主机名称（可空，用默认名）、实例数量（默认 1）、用途（环境）、业务线。一次创建 N 台（N>1）时，名称自动后缀 _01…_0N。<br>1）超级管理员、管理员创建后即可运行；运维员创建默认提交超级管理员审批，主机进入待审批。<br>3.**操作-审批**：仅超级管理员可审批创建；通过后主机运行，驳回后主机终止。运维员提交的【终止】进入「终止待审批」，超级管理员可同意（→已终止）或拒绝（→运行中）。<br>4.**操作-远程访问**：对运行中且策略允许的主机发起远程访问，默认手机端签名认证（见 6.7.1）。<br>5.**操作-更多（重启 / 关机 / 终止等）**：重启、关机弹窗确认；超级管理员 / 管理员终止默认签名认证；运维员终止走管理员审批（不立即终止、不签名）。更改类型、更换安全组、取消关联弹性 IP 等入口提示后期迭代。<br>6.**详情页**：展示基本信息（ID、状态、实例类型、IP、DNS、弹性 IP、VPC、子网等）及页签（详细信息 / 状态和警报 / 监控 / 安全 / 联网 / 存储 / 标签 / 操作记录）。<br>7.**详情-标签**：用途（环境）、业务线默认为静态展示；点【编辑】进入可编辑态（用途为下拉，业务线为文本输入），点【保存】写回；【取消】退出编辑不保存。不使用双击改值。<br>8.**数据权限**：超级管理员 / 管理员可见全部云主机；非管理员仅可见已授权主机。 |
| **输出/后置条件** | 1.直接创建成功的主机进入运行中，可发起远程；待审批主机出现在列表中，审批通过后可远程。<br>2.关机成功后状态为已停止；重启成功后保持运行中。 |
| **异常提示及处理** | 1.未接入就进入云主机：提示「为保障内网资源安全，需接入零信任防护网络后方可操作」，不展示数据。<br>2.运维员提交创建：提示「等待超级管理员审批」，待审批主机不可启动、不可远程。<br>3.审批驳回：提示「驳回，主机已终止」，主机进入已终止状态。<br>4.对离线或已停止主机发起远程：提示「离线，不可远程访问」。<br>5.打开尚未提供的字段或入口（CPU、标签、镜像、挂载卷等）：提示「后期迭代」。<br>6.终止取消签名认证：不执行终止。 |

| **功能描述** | 1.**列表字段**：名称 / ID、VPC ID / 名称、描述、入站规则的计数、出站规则的计数、创建用户、操作。系统默认安全组的创建用户显示为「-」。<br>2.**新建安全组**：填写安全组名称（不可重名）、描述、入出站规则；保存后生成安全组规则 ID；创建用户记为当前用户。<br>3.**操作-详情 / 编辑规则**：每条规则含类型（如 SSH / HTTPS / 自定义 TCP）、协议（随类型带出）、端口范围（类型未固定端口时必填）、源或目标（入站为源、出站为目标）、描述。仅可编辑自己创建的安全组；系统默认不可编辑。<br>4.**操作-删除**：仅可删除自己创建的安全组；系统默认不可删除；删除前检查是否仍有云主机使用。<br>5.**数据权限**：列表展示全量安全组；浏览者可查看，不可新建 / 编辑 / 删除。 |

| **异常提示及处理** | 3.保存校验不通过：名称为空提示「请填写安全组名称」；规则缺源 / 目标提示「请填写源 / 目标」；缺端口范围提示「请填写端口范围」，均不保存。<br>4.安全组名称已存在：提示「安全组名称已存在」，不创建。<br>5.管理端口（22）来源为任意地址（0.0.0.0/0）：提示「管理端口（22）不能对任意地址开放」，需收敛来源后再保存。<br>6. 删除仍被云主机使用的默认业务安全组：提示「默认业务安全组已被云主机使用，不可删除」。<br>7.浏览者尝试新建或删除：提示「当前角色无权访问该页面」，只保留查看。 |

## 6.9 审计

浏览者的权限和菜单都不包含审计。具备审计查看权限的角色可查看全量日志（不按操作者过滤）。时间筛选是时间段，最长 7 天。超过 7 天不能作为一次有效查询，提示「时间段最长一周」。无记录时提示「暂无匹配记录」。

### 6.9.1 访问日志

| **用户场景** | 管理员或运维员回看某一次远程访问的全过程 |
| --- | --- |
| **需求描述** | 谁在何时以何种方式接入资源，接入后做了什么 |
| **优先级** | P1 |
| **输入/前置条件** | 当前角色可查看审计；有权限时列表为全量（不按操作者过滤）。 |
| **功能描述** | 1.**列表字段（人员访问 / 全部视图）**：开始时间、操作者、主机、入口、接入结果、期间操作、结束时间、结束原因、是否越权。<br>1）默认一行一次访问；入口：受控隧道 / 直接 SSH / 任务等；接入结果：成功 / 拒绝 / 阻断。<br>2.**视图筛选**：全部日志、人员访问（默认）、按操作、按裁决、身份待确认、自动任务，是同一批记录上的不同看法。<br>1）按操作视图字段：时间、操作者、主机、操作分类、操作摘要、结果、所属访问，行可回到同一次访问时间线。<br>2）按裁决视图字段：时间、操作者、主机、类型、结果、目标、原因、是否越权、所属访问。<br>3.**操作-查看时间线**：点开一次访问，按接入、会话、主机操作、中途拒绝、结束展示节点，并带上告警与完整性。<br>4.直接 SSH、本地操作、定时任务标为无平台接入会话，不进入人员访问；身份尚未对上的记录进入「身份待确认」。 |
| **输出/后置条件** | 1.用户能顺着一行看完一次访问为什么开始、做了什么、为什么结束。 |
| **异常提示及处理** | 1.时间段超过 7 天：提示「时间段最长一周」，不按该范围查询。<br>2.无匹配记录：提示「暂无匹配记录」。<br>3.命令、文件内容和密钥不出现原文：内容脱敏为「[已隐藏]」。 |

# 7 功能列表字段说明

本章按功能列表逐模块说明业务数据所需字段的含义，供设计与开发对齐数据要求。类型从产品视角描述（文本、数字、单选、多选、开关、状态、日期时间、日期、时间段、条件组合、规则列表等），仅限数据字段，不含页面布局与操作说明。

| 应用状态 | 状态 | 未初始化 / 初始化中 / 已完成。决定成员进入应用时看到开通向导、完整菜单或无权限说明。 |
| 超级管理员 | 单选 | 初始化完成后在用户列表中指定；指定前不开放云资源、策略、远程和审计。 |

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith('|')) {
        if (!isTableSep(lines[i])) rows.push(lines[i].split('|').slice(1, -1).map(c => c.trim()));
        i++;
      }
      if (!rows.length) continue;
      html += '<table><thead><tr>' + rows[0].map(c => `<th>${mdInline(c)}</th>`).join('') + '</tr></thead><tbody>';
      rows.slice(1).forEach(r => { html += '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>'; });
      html += '</tbody></table>';
      continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if (hm) {
      const level = hm[1].length;
      const text = hm[2];
      const num = text.match(/^(\d+(?:\.\d+)*)/);
      const id = num ? `prd-${num[1]}` : `prd-h-${toc.length}`;
      if (level === 2 || level === 3) toc.push({ id, text, level });
      const jump = text.match(/^(\d+(?:\.\d+)*)/);
      const btn = jump && PRD_JUMP[jump[1]] ? `<button class="btn sm" onclick="openPrototype('${jump[1]}')">查看原型</button>` : '';
      html += `<h${level} id="${id}">${mdInline(text)}${btn}</h${level}>`;
      i++;
      continue;
    }
    const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
    if (im) {
      let src = im[2];
      if (src.startsWith('./')) src = src.slice(2);
      else if (!/^(https?:|data:|\.\.)/.test(src)) src = '../' + src;
      const cap = im[1] ? `<figcaption>${mdInline(im[1])}</figcaption>` : '';
      html += `<figure><img src="${src}" alt="${mdInline(im[1])}">${cap}</figure>`;
      i++;
      continue;
    }
    if (line.trim() === '---') { html += '<hr>'; i++; continue; }
    if (line.startsWith('- ')) {
      html += '<ul>';
      while (i < lines.length && lines[i].startsWith('- ')) { html += `<li>${mdInline(lines[i].slice(2))}</li>`; i++; }
      html += '</ul>';
      continue;
    }
    if (/^\d+\.\s/.test(line)) {
      html += '<ol>';
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) { html += `<li>${mdInline(lines[i].replace(/^\d+\.\s/, ''))}</li>`; i++; }
      html += '</ol>';
      continue;
    }
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^#{1,4}\s/.test(lines[i]) && !lines[i].startsWith('|') && !lines[i].startsWith('- ') && !lines[i].startsWith('![') && lines[i].trim() !== '---' && !/^\d+\.\s/.test(lines[i])) {
      buf.push(lines[i]);
      i++;
    }
    html += `<p>${mdInline(buf.join(' '))}</p>`;
  }
  return { html, toc };
}

  const closing = state.tabs.find(t => t.id === id);

  if (state.activeTab === id) {

function userDevices(user){

function userEmployment(name){
  return { Zhou: '离职', Wang: '离职' }[name] || '在职';
}
function userIdOf(name){
  return (state.userIdMap && state.userIdMap[name]) || '—';
}
function userRolesOf(user, fallback){
  const m = state.userRoleMap && state.userRoleMap[user];
  if (m && m.length) return m.slice();
  if (Array.isArray(fallback) && fallback.length) return fallback.slice();
  if (fallback) return [fallback];
  return ['浏览者'];
}
/* 操作权限集合：permTree × permChecked；集合不同即冲突（A 有而 B 没有） */
function roleOpSignature(role){
  const keys = [];
  permTree.forEach(b => b.l2.forEach(s => s.ops.forEach(op => {
    if (permChecked(role, b.l1, op, s.name)) keys.push(b.l1 + '|' + s.name + '|' + op);
  })));
  return keys.join('\n');
}
function rolesOpConflict(roles){
  if (!roles || roles.length < 2) return false;
  const sig = roleOpSignature(roles[0]);
  return roles.some(r => roleOpSignature(r) !== sig);
}
function permDataQmark(){
  return '<span class="qmark" tabindex="0">?<span class="qmark-pop">多角色的数据权限取并集</span></span>';
}
function permMergeRadios(name, mode, pendingName){
  const m = mode === 'inter' ? 'inter' : 'union';
  const one = (val, label) => {
    const oc = pendingName ? ` onchange="setPendingMerge('${pendingName}','${val}')"` : '';
    return `<label style="display:inline-flex;gap:4px;margin-right:10px;align-items:center"><input type="radio" name="${name}" value="${val}" ${m === val ? 'checked' : ''}${oc}> ${label}</label>`;
  };
  return one('union', '并集') + one('inter', '交集');
}
function userRoleConflictHtml(roles, savedMode){
  const head = `<label>权限冲突${permDataQmark()}</label>`;
  if (!rolesOpConflict(roles)) return head + '<div style="margin-top:6px">—</div>';
  const mode = savedMode === 'inter' ? 'inter' : 'union';
  return head + `<div style="margin-top:6px">${permMergeRadios('userPermMerge', mode)}</div>`;
}
function refreshUserRoleConflict(){
  const el = document.getElementById('userRoleConflict');
  const box = document.getElementById('userRoleBoxes');
  if (!el || !box) return;
  const roles = [...box.querySelectorAll('input:checked')].map(inp => inp.value);
  const cur = el.querySelector('input[type="radio"]:checked');
  const mode = cur && cur.value === 'inter' ? 'inter' : 'union';
  el.innerHTML = userRoleConflictHtml(roles, mode);
}
function saveUserRoles(user){
  const box = document.getElementById('userRoleBoxes');
  const roles = box ? [...box.querySelectorAll('input:checked')].map(el => el.value) : [];
  if (!roles.length) { toast('请至少选择一个角色'); return; }
  if (!state.userRoleMap) state.userRoleMap = {};
  state.userRoleMap[user] = roles;
  if (!state.userPermMerge) state.userPermMerge = {};
  if (rolesOpConflict(roles)) {
    const picked = document.querySelector('#userRoleConflict input[type="radio"]:checked');
    state.userPermMerge[user] = (picked && picked.value === 'inter') ? 'inter' : 'union';
  } else {
    delete state.userPermMerge[user];
  }
  toast('已修改 ' + user + ' 的角色，权限与授权资源取并集');
  closeDrawer();
  renderApp();
}
function clampSessionHours(v){
  const n = parseInt(v, 10);
  if (!Number.isFinite(n) || n < 1) return 1;
  if (n > 24) return 24;
  return n;
}
function saveSuperTransfer(fromUser){
  const sel = document.getElementById('superTransferTarget');

  if (userEmployment(toUser) !== '在职') { toast('只能转移给在职用户'); return; }

  state.userRoleMap[fromUser] = fromRoles;
  let toRoles = userRolesOf(toUser);
  if (!toRoles.includes('超级管理员')) toRoles = toRoles.concat(['超级管理员']);
  state.userRoleMap[toUser] = toRoles;

}

function toggleAuthRes(user, name, on){

function addTrustedDevice(user){

function revokeTrustedDevice(user, i){

    userDevices(user).splice(i, 1);

  });
}

/* ---------- 角色权限（页面，非抽屉） ---------- */
function permChecked(role, l1, op, l2){
  if (role === '超级管理员' || role === '管理员') return true;
  if (role === '浏览者') {
    // 浏览者按 PRD4.2：工作台查看 + 云主机/VPC/安全组/弹性IP 查看 + 可信设备查看；无远程/权限管理/访问策略/审计/写操作
    if (l1 === '工作台') {
      return (l2 === '资源汇总' && op === '查看资源汇总KPI')
        || (l2 === '近24小时告警' && (op === '查看告警列表' || op === '查看详情'));
    }
    if (l1 === '资源管理' && l2 === '云主机' && op === '查看') return true;
    if (l1 === '网络与安全' && ['VPC', '安全组', '弹性 IP'].includes(l2) && op === '查看') return true;
    if (l1 === '零信任策略' && l2 === '可信设备' && op === '查看') return true;
    return false;
  }
  // 运维员及自定义：无权限管理 / 访问策略；可信设备有查看（及对自己设备的吊销，由页面控制）
  if (l1 === '权限管理') return false;
  if (l1 === '零信任策略') {
    if (l2 === '访问策略') return false;
    if (l2 === '可信设备') return op === '查看' || op === '吊销';
    return false;
  }
  return true;
}

/* 角色勾选状态（原型内存态）：key = 一级|二级|操作 */
function permSelOf(role){
  if (!state.permSel[role]) {
    const o = {};
    permTree.forEach(b => b.l2.forEach(s => s.ops.forEach(op => { o[b.l1 + '|' + s.name + '|' + op] = permChecked(role, b.l1, op, s.name); })));
    state.permSel[role] = o;
  }
  return state.permSel[role];
}
function permToggle(role, key, on){
  permSelOf(role)[key] = on;
  secRefresh(role);
}

/* ---------- 高风险操作 · 二次确认（与「能不能做」分离）---------- */
/* 敏感操作白名单：[二级功能, 操作]；仅「上表已勾选 ∩ 白名单」的操作出现在二次确认表 */
const SEC_WHITELIST = [
  ['云主机', '远程访问'],
  ['角色', '删除角色'], ['角色', '权限'],
  ['用户', '删除'],
  ['访问策略', '删除'],
  ['可信设备', '确认'], ['可信设备', '吊销'],
  ['云主机', '创建'], ['云主机', '终止'],
  ['安全组', '编辑规则'], ['安全组', '删除'],
  ['弹性 IP', '释放'],
];
const SEC_MODE = { none: '无', qr: '签名认证', approve: '管理员审批' };
/* 默认按角色区分：运维员 = 接入/远程访问签名认证、创建/终止审批；管理员/超管 = 接入/删策略/创建/远程访问/终止均签名认证 */
function secDefault(role, l2, op){
  const k = l2 + '|' + op;
  const isMgr = role === '超级管理员' || role === '管理员';
  if (isMgr) {
    if (['访问策略|删除', '云主机|创建', '云主机|远程访问', '云主机|终止'].includes(k)) return 'qr';
    return 'none';
  }
  // 运维员及自定义角色
  if (k === '云主机|远程访问') return 'qr';
  if (['云主机|创建', '云主机|终止'].includes(k)) return 'approve';
  return 'none';
}
function secModeOf(role, l2, op){
  if (!state.secConfirm[role]) state.secConfirm[role] = {};
  const m = state.secConfirm[role];
  const k = l2 + '|' + op;
  if (!(k in m)) m[k] = secDefault(role, l2, op);
  return m[k];
}
function secSet(role, key, mode){
  if (role === '超级管理员') return;      // 系统预设超管高风险确认不可改
  state.secConfirm[role][key] = mode;     // 单选互斥：同一操作只能有一种方式
  secRefresh(role);
}
function secRefresh(role){
  const el = document.getElementById('secBox');
  if (el) el.innerHTML = renderSecBox(role, role === '超级管理员');
}
function renderSecBox(role, readonly){
  const dis = readonly ? 'disabled' : '';
  const sel = permSelOf(role);
  const rows = [], warn = [];
  const modes = ['none', 'qr', 'approve'];
  permTree.forEach(b => b.l2.forEach(s => s.ops.forEach(op => {
    if (!SEC_WHITELIST.some(w => w[0] === s.name && w[1] === op)) return;
    if (!sel[b.l1 + '|' + s.name + '|' + op]) return;
    const key = s.name + '|' + op;
    const mode = secModeOf(role, s.name, op);
    const label = s.name + '-' + op;
    if (mode === 'none') warn.push(label);
    const idx = rows.length;
    rows.push(`<tr>
      <td style="width:240px">${label}</td>
      <td><div class="ops">${modes.map(m => `<label><input type="radio" name="sec-${idx}" ${dis} ${mode === m ? 'checked' : ''}
        ${readonly ? '' : `onchange="secSet('${role}','${key}','${m}')"`}> ${SEC_MODE[m]}</label>`).join('')}
        ${!readonly && mode === 'none' ? '<span class="tag warn">建议配置签名认证或审批</span>' : ''}</div></td>
    </tr>`);
  })));
  return `<table class="perm-table">
      <thead><tr><th>高风险操作（已勾选）</th><th>确认方式（单选互斥）</th></tr></thead>
      <tbody>${rows.join('') || '<tr><td colspan="2" class="muted">当前未勾选任何高风险操作</td></tr>'}</tbody>
    </table>
    ${note([
      '「能不能做」由上方权限勾选决定；本节只决定执行前是否需要<b>签名认证</b>或<b>管理员审批</b>。仅「已勾选 ∩ 高风险白名单」的操作出现在此处。',
      '<b>高风险操作白名单</b>：云主机-远程访问 / 创建 / 终止；角色-删除角色 / 权限；用户-删除；访问策略-删除；可信设备-确认 / 吊销；安全组-编辑规则 / 删除；弹性 IP-释放。',
      '同一操作只能选一种方式：无 / 签名认证 / 管理员审批互斥。',
      '审批人不在界面配置：仅<b>超级管理员</b>（应用第一个管理者）拥有审批权限；管理员及其他角色无审批权限。',
      '<b>默认·运维员</b>：云主机-远程访问 = 签名认证；云主机-创建、云主机-终止 = 管理员审批；其余白名单项默认「无」。',
      '<b>默认·管理员 / 超级管理员</b>：访问策略-删除、云主机-创建、云主机-远程访问、云主机-终止 = 签名认证；其余白名单项默认「无」。',
      '「认证当前设备」是工作台 / 可信设备流程（固定扫码），不是操作勾选项，故不在本表。',
      '<b>云主机-远程访问</b>：等同于「远程访问」功能中已授权资源的远程访问；列表点「远程访问」按上表确认方式执行（默认同签名认证）。',
      '云主机-创建 配置为「管理员审批」时：创建成功后主机进入列表，状态为「待审批」，超级管理员审批通过前不可启动（见资源管理 / 云主机）。',
      readonly
        ? '系统预设「超级管理员」的高风险操作二次确认只读，不可修改。'
        : (warn.length
          ? `<span style="color:var(--warn)">以下已勾选的高风险操作未配置二次确认：${warn.join('、')}。建议配置签名认证或审批（仅提示，不阻断保存）。</span>`
          : '已勾选的高风险操作均已配置二次确认。'),
    ], 'margin-top:12px')}`;
}

  const dis = readonly ? 'disabled' : '';

}

function condSummary(p){
  const parts = (p.conds || []).map(c => {
    const as = (c.attrs || []).filter(a => a.vals.length);
    if (c.all || !as.length) return `${c.type}：全部`;
    return `${c.type}：` + as.map(a => `${a.name}∈${a.vals.join(',')}`).join(' 且 ');
  });
  return parts.length ? parts.join('；') : '—';
}

/* 原型「今天」固定为 2026-11-18，便于演示：启用当日 → +60 自然日 */
function polToday(addDays){
  const d = new Date(2026, 10, 18 + (addDays || 0));
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function openPolicy(id){
  const src = id === 'new'
    ? { id: 'new', name: '', system: false, roles: [], actions: ['远程登录'], status: '启用', start: polToday(0), end: polToday(60), sessionHours: 8, conds: [] }
    : state.policies.find(x => x.id === id);
  if (!src) return;
  state.policyDraft = JSON.parse(JSON.stringify(src));
  state.policyDraft.readonly = !!src.system;
  if (!src.system) state.policyDraft.actions = ['远程登录'];   // 动作固定
  openDrawer('policy-edit', { id });
}

  polRefresh();
}
function polAddAttr(i){
  const c = state.policyDraft.conds[i];
  const free = Object.keys(POL_ATTRS).find(n => !c.attrs.some(a => a.name === n));
  if (!free) { toast('已添加全部可选属性'); return; }
  c.attrs.push({ name: free, vals: [] });
  polRefresh();
}
function polDelAttr(i, j){ state.policyDraft.conds[i].attrs.splice(j, 1); polRefresh(); }
function polAttrName(i, j, v){
  const a = state.policyDraft.conds[i].attrs[j];
  a.name = v; a.vals = [];
  polRefresh();
}
function polAttrVal(i, j, v){
  const a = state.policyDraft.conds[i].attrs[j];
  a.vals = a.vals.includes(v) ? a.vals.filter(x => x !== v) : a.vals.concat(v);
  polRefresh();
}

function polSave(){
  const d = state.policyDraft;
  if (!d.name.trim()) { toast('请填写策略名称'); return; }
  if (!d.roles.length) { toast('请至少选择一个适用角色'); return; }
  if (!d.actions.length) { toast('请至少选择一个动作'); return; }
  if (!d.conds.length) { toast('请添加资源条件'); return; }
  if (d.conds.some(c => !c.attrs.length || c.attrs.some(a => !a.vals.length))) { toast('请为每个属性选择属性值'); return; }
  const out = JSON.parse(JSON.stringify(d));
  delete out.readonly;
  out.name = out.name.trim();
  out.status = '启用';   // 保存即启用
  if (d.id === 'new') {
    out.id = 'p-' + Date.now();
    state.policies.push(out);
  } else {
    const k = state.policies.findIndex(x => x.id === d.id);
    if (k >= 0) state.policies[k] = out;
  }
  closeDrawer();
  toast('访问策略已保存');
  if (state.page === 'policies') renderApp();
}

function delPolicy(id){
  state.policies = state.policies.filter(x => x.id !== id || x.system);
  if (state.page === 'policies') renderApp();
}
function togglePolicy(id){
  const p = state.policies.find(x => x.id === id);
  if (!p || p.system) return;
  const next = p.status === '启用' ? '停用' : '启用';
  if (next === '启用') {
    confirmModal(
      `确认启用策略「${p.name}」？启用后有效期将设为启用当日起 60 个自然日。`,
      '',
      '启用',
      () => {
        p.status = '启用';
        p.start = polToday(0); p.end = polToday(60);
        toast(`已启用，有效期自动设为 ${p.start} ~ ${p.end}（启用当日起 60 个自然日）`, 3000);
        renderApp();
      }
    );
  } else {
    confirmModal(`确认停用策略「${p.name}」？`, '已停用', '停用', () => {
      p.status = '停用';
      renderApp();
    });
  }
}

function drawerPolicy(){
  const d = state.policyDraft;
  const ro = !!d.readonly;
  const dis = ro ? 'disabled' : '';
  const others = POL_ROLES.filter(r => r !== '管理员');
  const allOn = ro || others.every(r => d.roles.includes(r));

  const roleBox = POL_ROLES.map(r => {
    if (r === '管理员') {
      return `<label class="dis"><input type="checkbox" checked disabled> 管理员</label>`;
    }
    return `<label class="${ro ? 'dis' : ''}"><input type="checkbox" ${dis} ${(ro || d.roles.includes(r)) ? 'checked' : ''}
      onchange="polToggleRole('${r}',this.checked)"> ${r}${r === '值班运维' ? '<span class="muted">（自定义角色示例）</span>' : ''}</label>`;
  }).join('');

  const actBox = ro
    ? `<label class="dis"><input type="checkbox" checked disabled> 全部动作</label>`

  const condCards = d.conds.map((c, i) => {
    const typeSel = `<select ${dis} onchange="polCondType(${i},this.value)">${POL_RES_TYPES.map(t =>
      t === '云主机'
        ? `<option ${c.type === t ? 'selected' : ''}>${t}</option>`
        : `<option disabled>${t}（后期迭代）</option>`).join('')}</select>`;
    let inner;
    if (c.all) {
      inner = `<div class="muted">全部云主机（无属性限制）</div>`;
    } else {
      inner = c.attrs.map((a, j) => `
        <div class="attr-row">
          <div class="field"><label>属性名称</label>
            <select ${dis} onchange="polAttrName(${i},${j},this.value)">
              ${Object.keys(POL_ATTRS).map(n => `<option ${a.name === n ? 'selected' : ''} ${(n !== a.name && c.attrs.some(x => x.name === n)) ? 'disabled' : ''}>${n}</option>`).join('')}
            </select></div>
          <div class="field"><label>属性值（多选，任一命中）</label>
            <div class="chips">${POL_ATTRS[a.name].map(v => `<span class="chip ${a.vals.includes(v) ? 'on' : ''} ${ro ? 'dis' : ''}"
              onclick="polAttrVal(${i},${j},'${v}')">${v}</span>`).join('')}</div></div>
          ${ro || c.attrs.length < 2 ? '<span></span>' : `<button class="btn link" style="color:var(--danger)" onclick="polDelAttr(${i},${j})">删除</button>`}
        </div>`).join('') +
        (ro ? '' : `<div style="margin-top:8px"><button class="btn sm" onclick="polAddAttr(${i})">+ 添加属性</button></div>`);
    }
    return `<div class="pcard" id="polCond-${i}">

      </div>

  }).join('');

  return `
    ${ro ? note(['系统预置规则「管理员全量访问」：适用超级管理员与管理员，仅可查看，不可编辑、不可删除。'], 'margin-bottom:14px') : ''}

    <div class="dsec">
      <div class="dl">适用角色 <span class="req">*</span></div>
      <div class="chk-list">

    <div class="dsec">

      ${condCards || `<div class="muted" style="margin-bottom:8px">尚未添加资源条件</div>`}
      ${ro ? '' : `<div style="margin-top:10px"><button class="btn sm" onclick="polAddCond()">+ 添加资源条件</button></div>`}
      ${note([
        '同一资源类型只有一张卡，同类型的多个属性合并在卡内。',
        '同一张卡内，多个属性之间为「且」（AND）：需同时满足。',

      <div class="dl">有效期</div>
      <div class="grid3">
        <div class="field"><label>开始</label>${ro ? `<input disabled value="长期有效">` : `<input type="date" value="${d.start}" onchange="polField('start',this.value)">`}</div>

        '单次有效时长填写 1–24 的整数（小时）；非法值自动钳制到 1–24。',
        '保存即为启用，故表单不展示「启用状态」。',
      ], 'margin-top:10px')}
    </div>`;
}

function confirmDrawer(title, message, okMsg, okLabel){

}

/* 简短确认：居中遮罩弹窗（与「认证当前设备」同一 overlay 模式），用于删除用户 / 删除策略 */
function confirmModal(message, okMsg, okLabel, onOk){
  confirmModal._cb = onOk || null;
  confirmModal._msg = okMsg || '已确认';
  document.getElementById('overlay').innerHTML = `
    <div class="mask" onclick="if(event.target.classList.contains('mask')) closeQr()">
      <div class="modal" style="width:360px">
        <div style="font-size:15px;font-weight:600;line-height:1.6">${message}</div>
        <div class="row" style="justify-content:flex-end;margin-top:20px">
          <button class="btn" onclick="closeQr()">取消</button>
          <button class="btn primary" onclick="confirmModalOk()">${okLabel || '确认'}</button>
        </div>
      </div>
    </div>`;
}
function confirmModalOk(){
  const cb = confirmModal._cb;
  const msg = confirmModal._msg;
  closeQr();
  if (cb) cb();
  if (msg) toast(msg);
}
function roleCreateSave(){
  const name = (document.getElementById('rcName').value || '').trim();
  const desc = (document.getElementById('rcDesc').value || '').trim();
  if (!name) { toast('请填写角色名'); return; }
  if (/['"<>&\\]/.test(name)) { toast('角色名不能包含特殊字符'); return; }
  if (['超级管理员', '管理员', '运维员', '浏览者'].includes(name) || state.customRoles.some(r => r.name === name)) { toast('角色名已存在'); return; }
  state.customRoles.push({ name, desc, id: 'role_custom_' + (state.customRoles.length + 1) });
  closeDrawer();
  toast('角色已创建，请在列表中点击「权限」继续配置');
  if (state.page === 'roles') renderApp();
}

    if (btn) btn.textContent = '取消（' + n + 's）';

function renderConnectGate(zt){
  const c = state.channelCase;
  const dev = currentDevice();
  let auth = '已授权', devSt = '当前设备为可信设备', body = '';
  if (c === 'noperm') {
    auth = '未授权';
    devSt = '—';
    body = `<div style="font-size:15px;font-weight:600;margin-bottom:8px">当前账号尚未授权</div>
      <div class="sub" style="line-height:1.7">请联系管理员添加该用户，并完成授权后再接入内网。</div>`;
  } else if (c === 'token') {
    devSt = '凭证已失效';
    body = `<div class="sub">登录凭证已失效，请重新进入应用后再接入。</div>`;
  } else if (c === 'offline') {
    devSt = '网络不可用';
    body = `<div class="sub">网络不可用，恢复后可接入。</div>`;
  } else if (c === 'device' && !state.deviceCertSent) {
    devSt = '尚无可信设备';
    body = `<div style="font-size:15px;font-weight:600;margin-bottom:8px">请认证当前设备</div>
      <button class="btn primary" style="margin-top:16px" onclick="certifyFirstDevice()">认证该设备</button>`;
  } else if (c === 'device' && state.deviceCertSent) {
    devSt = state.gateReason === 'revoked' ? '当前设备已吊销' : '当前设备未认证';
    body = state.gateReason === 'revoked'
      ? `<div style="font-size:15px;font-weight:600;margin-bottom:8px">当前设备已被吊销</div>
         <button class="btn primary" style="margin-top:16px" onclick="submitExtraDevice()">重新发起认证</button>`
      : `<div style="font-size:15px;font-weight:600;margin-bottom:8px">请确认当前设备，并等待超级管理员认证</div>
         <div class="row" style="margin-top:16px">
           <button class="btn primary" onclick="submitExtraDevice()">提交认证</button>
           <button class="btn" onclick="setGate('trusted')">模拟超级管理员已认证</button>
         </div>`;
  } else {
    body = `<div style="font-size:15px;font-weight:600;margin-bottom:8px">当前设备已是可信设备</div>
      <button class="btn primary" style="margin-top:16px" onclick="connectIntranet()">接入内网</button>`;
  }
  const chips = [
    ['unauth', '未授权'],
    ['first', '第一台设备'],
    ['waitadmin', '新设备待超管'],
    ['trusted', '当前设备可信'],
    ['token', '凭证失效'],
    ['offline', '网络不可用'],
  ];
  zt.innerHTML = `
    <div class="zt-bar">
      <b>零信任云平台</b><span class="crumb">/ 接入零信任防护网络</span>
      <div style="flex:1"></div>

      <button class="btn" onclick="showApps()">返回应用</button>
    </div>
    <div class="content">
      <div class="card" style="max-width:680px;margin:28px auto">
        <h2 style="margin:0 0 14px">接入零信任防护网络</h2>
        <div class="kv" style="margin-bottom:16px">
          <div class="k">用户授权状态</div><div>${auth}</div>
          <div class="k">当前使用设备</div><div>${dev.id} · ${dev.mac}</div>
          <div class="k">设备状态</div><div>${devSt}</div>
        </div>
        ${body}
        ${note([
          '打开应用后先到本页接入内网，接入成功后才进入功能页。',
          '预览：' + chips.map(([k, n]) => `<button class="btn link" onclick="setGate('${k}')">${n}</button>`).join(' '),

function channelBar(){
  const c = state.channelCase;
  const m = channelMeta[c];
  let actions = '';
  if (m.btn === 'disconnect') actions = `<button class="btn sm" onclick="setTunnel(false)">断开</button>`;
  else {
    actions = `<button class="btn sm primary" onclick="setTunnel(true)" ${m.btn === 'enable' ? '' : 'disabled'}>接入</button>`;
    if (m.btn === 'reenter') actions = `<button class="btn sm" onclick="reenterApp()">重新进入</button>` + actions;
    if (m.btn === 'device') actions = `<button class="btn sm" onclick="openDeviceCert()">认证当前设备</button>` + actions;
  }
  const dot = c === 'connected' ? 'on' : (c === 'ready' ? 'warn' : '');
  const chipCls = c === 'connected' ? 'on' : 'off';
  return `<div class="tunnel-bar">
      <span class="t-label">零信任防护网络</span>
      <span class="t-status ${chipCls}"><span class="tunnel-dot ${dot}"></span>${m.label}</span>
      <span class="t-info">${(c === 'device' && state.deviceCertSent) ? '认证申请已发送管理员，若认证成功可接入零信任防护网络' : m.hint}</span>
      <div class="t-actions">${actions}</div>
    </div>`;
}

/* 未接入零信任防护网络：资源 / 网络类列表仅保留表头，无数据行，给一行统一提示 */
const ZT_TIP = '为保障内网资源安全，需接入零信任防护网络后方可操作';
function ztEmptyRow(cols){ return `<tr class="zt-empty"><td colspan="${cols}">${ZT_TIP}</td></tr>`; }

function wbKpi(title, value, hint, page){
  if (!page) return `<div class="kpi"><div class="l">${title}</div><div class="v">${value}</div><div class="hint">${hint}</div></div>`;
  return `<div class="kpi clickable" onclick="go('${page}')"><div class="l">${title}</div><div class="v">${value}</div><div class="hint">${hint}</div></div>`;
}

/* 添加用户：左侧 IM 组织树勾选 ↔ 右侧「待新增用户」双向同步（state.pendingUsers） */
const ORG_TREE = [
  { dept: '运维部', users: [{ name: 'Lin' }, { name: 'Chen' }, { name: 'Vivi', added: true }] },
  { dept: '研发部', users: [{ name: 'Zhou' }] },
];
function openAddUser(){
  state.pendingUsers = [{ name: 'Lin', dept: '运维部', role: '运维员', roles: ['运维员'] }];
  openPageTab('add-user', '添加用户', 'users-add');
}
function addRefresh(){
  const el = document.getElementById('ztContent');
  if (el && state.page === 'users-add') el.innerHTML = vUsersAdd();
}
function pendingHas(name){ return state.pendingUsers.some(u => u.name === name); }
function setPending(name, dept, on){
  if (on && !pendingHas(name)) state.pendingUsers.push({ name, dept, roles: ['浏览者'] });
  if (!on) state.pendingUsers = state.pendingUsers.filter(u => u.name !== name);
}
function toggleOrgUser(name, dept){
  setPending(name, dept, !pendingHas(name));
  addRefresh();
}
function toggleOrgDept(dept){
  const g = ORG_TREE.find(x => x.dept === dept);
  const sel = g.users.filter(u => !u.added);
  const allOn = sel.length && sel.every(u => pendingHas(u.name));
  sel.forEach(u => setPending(u.name, dept, !allOn));
  addRefresh();
}
function removePending(name){
  state.pendingUsers = state.pendingUsers.filter(u => u.name !== name);
  addRefresh();
}
function pendingRoles(u){
  if (u.roles && u.roles.length) return u.roles.slice();
  return [u.role || '浏览者'];
}
function setPendingRole(name, role, on){
  const u = state.pendingUsers.find(x => x.name === name);
  if (!u) return;
  let roles = pendingRoles(u).filter(r => r !== role);
  if (on) roles.push(role);
  if (!roles.length) { toast('至少保留一个角色'); roles = ['浏览者']; }
  u.roles = roles;
  if (!rolesOpConflict(roles)) delete u.permMerge;
  addRefresh();
}
function setPendingMerge(name, mode){
  const u = state.pendingUsers.find(x => x.name === name);
  if (!u) return;
  if (!rolesOpConflict(pendingRoles(u))) { delete u.permMerge; return; }
  u.permMerge = mode === 'inter' ? 'inter' : 'union';
}
function confirmAddUsers(){
  if (!state.pendingUsers.length) { toast('请先在左侧勾选要添加的用户'); return; }
  if (!state.userRoleMap) state.userRoleMap = {};
  if (!state.userPermMerge) state.userPermMerge = {};
  state.pendingUsers.forEach(u => {
    const rs = pendingRoles(u);
    state.userRoleMap[u.name] = rs;
    if (rolesOpConflict(rs)) state.userPermMerge[u.name] = u.permMerge === 'inter' ? 'inter' : 'union';
    else delete state.userPermMerge[u.name];
  });
  const n = state.pendingUsers.length;
  state.pendingUsers = [];
  toast(`已添加 ${n} 个用户并同步至用户列表`);
  closePageTab('add-user');
  go('users');
}

function vUsersAdd(){
  const roles = ['浏览者', '运维员', '管理员'];
  const tree = ORG_TREE.map(g => {
    const sel = g.users.filter(u => !u.added);
    const allOn = sel.length > 0 && sel.every(u => pendingHas(u.name));
    return `<button onclick="toggleOrgDept('${g.dept}')"><input class="chk" type="checkbox" ${allOn ? 'checked' : ''}> ${g.dept}</button>` +
      g.users.map(u => u.added
        ? `<button disabled style="padding-left:24px;color:var(--muted)"><input class="chk" type="checkbox" checked disabled> ${u.name}（已添加）</button>`
        : `<button class="${pendingHas(u.name) ? 'on' : ''}" style="padding-left:24px" onclick="toggleOrgUser('${u.name}','${g.dept}')"><input class="chk" type="checkbox" ${pendingHas(u.name) ? 'checked' : ''}> ${u.name}</button>`
      ).join('');
  }).join('');
  const rows = state.pendingUsers.length ? state.pendingUsers.map(u => {
    const rs = pendingRoles(u);
    const cell = rolesOpConflict(rs) ? permMergeRadios('pm-' + u.name, u.permMerge, u.name) : '—';
    return `
              <tr>
                <td>${u.name}</td><td>${u.dept}</td>
                <td>${roles.map(r => `<label style="display:inline-flex;gap:4px;margin-right:10px;align-items:center"><input type="checkbox" ${rs.includes(r) ? 'checked' : ''} onchange="setPendingRole('${u.name}','${r}',this.checked)"> ${r}</label>`).join('')}</td>
                <td>${cell}</td>
              </tr>`;
  }).join('')
    : `<tr><td colspan="4" class="muted">暂未选择用户，请在左侧组织架构中勾选</td></tr>`;
  return `<div class="card stack">
    <div class="toolbar">
      <div class="l"><button class="btn" onclick="closePageTab('add-user')">返回</button><span class="pg-title">从 IM 组织选择用户</span></div>
    </div>
    <div class="split">
      <div class="box">
        <div class="box-hd"><span>IM 组织架构</span>
          <button class="btn sm" onclick="toast('组织已刷新')">刷新组织</button>
        </div>
        <div class="tree">${tree}</div>
      </div>
      <div class="box">
        <div class="box-hd">待新增用户（${state.pendingUsers.length}）</div>
        <div style="padding:8px">
          <table>
            <thead><tr><th>姓名</th><th>部门</th><th>角色 *（可多选）</th><th>权限冲突${permDataQmark()}</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${note(['默认角色=浏览者，可多选角色；权限与授权资源取并集。左侧勾选 / 取消与右侧待新增列表实时同步。', '无操作权限冲突时为「—」；有冲突才可选并集或交集，默认并集。'], 'margin-top:8px')}
        </div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn primary" onclick="confirmAddUsers()">确认添加</button>
    </div>
  </div>`;
}

/* 列表「远程访问」：默认手机签名认证后再进入会话 */
function hostRemoteBtn(name, ip, disabled){
  if (disabled) return `<button class="btn sm" disabled>远程访问</button>`;
  const occ = rmOccupantMap()[name];
  if (isAdmin() && occ && occ.user !== sessionUserName()) return `<button class="btn sm" onclick="rmInterrupt('${name}')">中断会话</button>`;
  return `<button class="btn sm" onclick="rmConnect('${name}','${ip || ''}')" ${remoteDis()}>远程访问</button>`;
}
/* 列表行「更多」：重启 / 关机用弹窗确认；终止（超管签名 / 运维提交待审批） / 升级Agent */
function hostTermPendingOf(name){
  return !!(state.hostTermPending && state.hostTermPending[name]);
}
function submitHostTerm(name){
  if (!state.hostTermPending) state.hostTermPending = {};
  state.hostTermPending[name] = true;
  const h = HOST_DEMO.find(x => x.name === name);
  if (h) h.termPending = true;
  toast('已提交终止，待超级管理员审批');
  renderApp();
}
function approveHostTerm(name){
  if (state.hostTermPending) delete state.hostTermPending[name];
  const h = HOST_DEMO.find(x => x.name === name);
  if (h) { h.termPending = false; h.run = false; h.status = 'terminated'; }
  toast('已同意终止');
  renderApp();
}
function rejectHostTerm(name){
  if (state.hostTermPending) delete state.hostTermPending[name];
  const h = HOST_DEMO.find(x => x.name === name);
  if (h) { h.termPending = false; h.run = true; delete h.status; }
  toast('已拒绝，主机恢复运行中');
  renderApp();
}
function hostRowMore(name, o){
  if (!canW()) return '';
  if (hostTermPendingOf(name) || (o && o.termPending)) return '';
  const items = [
    ['重启', `confirmModal('确认重启云主机 ${name}？','重启指令已下发','重启')`],
    ['关机', `confirmModal('确认关机（停止）云主机 ${name}？','关机指令已下发','关机')`, '', o.stopped],
  ];
  if (o.stopped) items.splice(1, 0, ['启动', o.start || `toast('启动指令已下发')`]);
  if (isSuperAdmin()) items.push(['终止', `qrConfirm('终止云主机 ${name}',()=>{const h=HOST_DEMO.find(x=>x.name==='${name}');if(h){h.run=false;h.status='terminated';}toast('已终止');renderApp()})`, 'danger']);
  else items.push(['终止', `confirmModal('该操作将由超级管理员审批通过后执行。是否提交？','已提交，待超级管理员审批','提交',()=>submitHostTerm('${name}'))`, 'danger']);
  items.push(['升级Agent', `toast('升级 Agent 任务已提交')`]);
  return hostMore(items);
}

const CLOUD_VENDORS = [
  { id: 'aws', name: '亚马逊云' },
  { id: 'aliyun', name: '阿里云', regions: [['cn-hangzhou','杭州'],['cn-shanghai','上海'],['cn-beijing','北京'],['cn-shenzhen','深圳'],['cn-hongkong','香港']] },
  { id: 'tencent', name: '腾讯云', regions: [['ap-guangzhou','广州'],['ap-shanghai','上海'],['ap-beijing','北京'],['ap-chengdu','成都'],['ap-hongkong','中国香港']] },
];
function vendorRegions(id){
  if (id === 'aws') return HC_REGIONS.flatMap(([, rs]) => rs);
  const v = CLOUD_VENDORS.find(x => x.id === id);
  return v && v.regions ? v.regions : [];
}
function vendorName(id){
  const v = CLOUD_VENDORS.find(x => x.id === id);
  return v ? v.name : (id || '—');
}
function regionLabel(vendor, region){
  const hit = vendorRegions(vendor).find(r => r[0] === region);
  return hit ? `${hit[1]}　${hit[0]}` : (region || '—');
}
function cloudCells(vendor, region){
  return `<td>${vendorName(vendor)}</td><td>${regionLabel(vendor, region)}</td>`;
}
function cloudScopeOf(key){
  if (!state.cloudScope[key]) state.cloudScope[key] = { vendor: '', region: '' };
  return state.cloudScope[key];
}
function setCloudVendor(key, vendor){
  const s = cloudScopeOf(key);
  s.vendor = vendor;
  if (!vendor || !vendorRegions(vendor).some(r => r[0] === s.region)) s.region = '';
  renderApp();
}
function setCloudRegion(key, region){
  cloudScopeOf(key).region = region;
  renderApp();
}
function cloudMatch(key, vendor, region){
  const s = cloudScopeOf(key);
  if (s.vendor && vendor !== s.vendor) return false;
  if (s.region && region !== s.region) return false;
  return true;
}
function cloudFilterBar(key){
  const s = cloudScopeOf(key);
  const regs = s.vendor ? vendorRegions(s.vendor) : [];
  return `<select class="cloud-pick" onchange="setCloudVendor('${key}', this.value)">
      <option value="" ${s.vendor ? '' : 'selected'}>全部云厂商</option>
      ${CLOUD_VENDORS.map(v => `<option value="${v.id}" ${v.id === s.vendor ? 'selected' : ''}>${v.name}</option>`).join('')}
    </select>
    <select class="cloud-pick" onchange="setCloudRegion('${key}', this.value)" ${s.vendor ? '' : 'disabled'}>
      <option value="">${s.vendor ? '全部区域' : '请先选择云厂商'}</option>
      ${regs.map(([id, n]) => `<option value="${id}" ${id === s.region ? 'selected' : ''}>${n}　${id}</option>`).join('')}
    </select>`;
}
function regionOptionsHtml(vendor, selected){
  if (vendor === 'aws') {
    return HC_REGIONS.map(([g, rs]) =>
      `<optgroup label="${g}">${rs.map(([id, n]) => `<option value="${id}" ${id === selected ? 'selected' : ''}>${n}　${id}</option>`).join('')}</optgroup>`).join('');
  }
  return vendorRegions(vendor).map(([id, n]) => `<option value="${id}" ${id === selected ? 'selected' : ''}>${n}　${id}</option>`).join('');
}
function cloudVendorOptions(selected){
  return CLOUD_VENDORS.map(v => `<option value="${v.id}" ${v.id === selected ? 'selected' : ''}>${v.name}</option>`).join('');
}
function fillCloudRegion(selectId, vendor, selected){
  const el = document.getElementById(selectId);
  if (!el) return;
  const regs = vendorRegions(vendor);
  const keep = selected && regs.some(r => r[0] === selected) ? selected : (regs[0] ? regs[0][0] : '');
  el.innerHTML = regs.map(([id, n]) => `<option value="${id}" ${id === keep ? 'selected' : ''}>${n}　${id}</option>`).join('');
  return keep;
}
function sgSetVendor(id){

}
function hdChart(title, unit, vals){
  const w = 240, h = 80, pad = 4, mx = Math.max.apply(null, vals.concat([1e-9]));
  const pts = vals.map((v, i) => `${(pad + i * (w - 2 * pad) / (vals.length - 1)).toFixed(1)},${(h - pad - (v / mx) * (h - 2 * pad)).toFixed(1)}`).join(' ');
  return `<div class="hd-chart"><div class="t">${title}</div><div class="u">${unit}</div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="0" y1="${h - pad}" x2="${w}" y2="${h - pad}" stroke="#e5e6eb"/>
      <line x1="0" y1="${h / 2}" x2="${w}" y2="${h / 2}" stroke="#f2f3f5"/>
      <polyline fill="none" stroke="#1664ff" stroke-width="1.5" points="${pts}"/>
    </svg>
    <div class="ax"><span>04:30</span><span>04:45</span><span>05:00</span><span>05:15</span></div></div>`;
}
function hdChips(){
  return `<div class="row" style="gap:6px">${['1小时','3小时','12小时','1天','3天','1周'].map((t, i) =>
    `<span class="chip ${i === 0 ? 'on' : ''}" onclick="this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${t}</span>`).join('')}</div>`;

function rmLines(s){
  if (!s.lines) s.lines = [
    '<div class="dim"># 裁决通过 · 命中访问策略 · 短证有效 · 设备可信</div>',
    `<div class="ok">connected to ${s.host} (${s.ip})</div>`,
    `<div class="dim"># 原型演示：可输入 ls / pwd / whoami / curl 10.0.99.8 / clear</div>`,
  ];
  return s.lines;
}
function rmCmd(ev, id){
  if (ev.key !== 'Enter') return;
  const s = state.remoteSessions.find(x => x.id === id);
  if (!s) return;
  const v = ev.target.value.trim();
  ev.target.value = '';
  if (!v) return;
  const L = rmLines(s);
  L.push(`<div>ubuntu@${s.host}:~$ ${escHtml(v)}</div>`);
  if (v === 'clear') s.lines = [];
  else if (/^curl\s+(https?:\/\/)?10\.0\.99\.8/.test(v)) L.push('<div class="bad">blocked: 该目标不在本次授权范围内</div><div class="dim"># 已写入访问日志与告警日志</div>');
  else if (v === 'ls') L.push('<div>app  backup.sh  deploy.tar.gz  logs  README.md</div>');
  else if (v === 'pwd') L.push('<div>/home/ubuntu</div>');
  else if (v === 'whoami') L.push('<div>ubuntu</div>');
  else L.push('<div class="dim">（原型演示：未实现该命令）</div>');
  const el = document.getElementById('rmTerm');
  if (el) {
    el.querySelector('.rm-lines').innerHTML = rmLines(s).join('');
    el.scrollTop = el.scrollHeight;
    const inp = document.getElementById('rmIn'); if (inp) inp.focus();
  }
}

  else if (f && (!occUser || f.user === occUser)) info = { id: f.deviceId, mac: f.mac };
  else if (occUser) {

    else {
      const list = state.deviceList || [];

    info = currentDevice();

const SG_TYPES = {

  '自定义 UDP': { proto: 'UDP', port: '', fixed: false },
  'SSH':        { proto: 'TCP', port: '22', fixed: true },
  'HTTP':       { proto: 'TCP', port: '80', fixed: true },
  'HTTPS':      { proto: 'TCP', port: '443', fixed: true },
  'MySQL/Aurora': { proto: 'TCP', port: '3306', fixed: true },
  'PostgreSQL': { proto: 'TCP', port: '5432', fixed: true },
  'DNS (UDP)':  { proto: 'UDP', port: '53', fixed: true },
};
const SG_PEER_TYPES = ['自定义', '任何位置-IPv4', '我的 IP'];

function sgHex(n){ let s = ''; while (s.length < n) s += Math.floor(Math.random() * 16).toString(16); return s; }
function sgRule(type, srcType, src, desc, rid, port){

}

/* 规则编辑器（抽屉与新建页共用）。ctx：'drawer' | 'cin' | 'cout' */
function sgRulesOf(ctx){
  if (ctx === 'drawer') return state.sgDraft.rules;
  return ctx === 'cin' ? state.sgCreate.inbound : state.sgCreate.outbound;
}
function sgDirOf(ctx){ return ctx === 'drawer' ? state.sgDraft.dir : (ctx === 'cin' ? 'in' : 'out'); }
function sgEditor(ctx){
  const rules = sgRulesOf(ctx);
  const peer = sgDirOf(ctx) === 'out' ? '目标' : '源';
  if (!rules.length) return `<div class="muted" style="padding:8px 0">暂无规则，点击「添加规则」新增</div>`;
  return rules.map((r, i) => {
    const t = SG_TYPES[r.type];
    return `<div class="sg-rule">
      <div class="sr-hd"><span>规则 ID：${r.isNew ? '—（保存后生成）' : r.rid}</span>
        <button class="btn link" style="color:var(--danger)" onclick="sgDelRule('${ctx}',${i})">删除</button></div>
      <div class="sr-grid">
        <div class="field"><label>类型</label>
          <select onchange="sgSetType('${ctx}',${i},this.value)">${Object.keys(SG_TYPES).map(k => `<option ${k === r.type ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
        <div class="field"><label>协议</label><input disabled value="${r.proto}"></div>
        <div class="field"><label>端口范围</label>
          <input ${t.fixed ? 'disabled' : ''} value="${escHtml(r.port)}" placeholder="如 8080 或 8000-8100" oninput="sgSetField('${ctx}',${i},'port',this.value)"></div>
        <div class="field"><label>${peer}类型</label>
          <select onchange="sgSetPeerType('${ctx}',${i},this.value)">${SG_PEER_TYPES.map(k => `<option ${k === r.srcType ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
        <div class="field"><label>${peer}</label>
          <input ${r.srcType !== '自定义' ? 'disabled' : ''} value="${escHtml(r.src)}" placeholder="CIDR 或安全组 ID" oninput="sgSetField('${ctx}',${i},'src',this.value)"></div>

          <input value="${escHtml(r.desc)}" oninput="sgSetField('${ctx}',${i},'desc',this.value)"></div>

}
function sgRefresh(ctx){
  if (ctx === 'drawer') {
    const bd = document.getElementById('drawerBody');
    if (!bd) return;
    const top = bd.scrollTop;
    bd.innerHTML = sgDrawerBody();
    bd.scrollTop = top;
  } else {
    const el = document.getElementById(ctx === 'cin' ? 'sgEdIn' : 'sgEdOut');
    if (el) el.innerHTML = sgEditor(ctx);
  }
}
function sgSetField(ctx, i, k, v){ sgRulesOf(ctx)[i][k] = v; }
function sgSetType(ctx, i, v){
  const r = sgRulesOf(ctx)[i], t = SG_TYPES[v];
  r.type = v; r.proto = t.proto;
  r.port = t.fixed ? t.port : '';
  sgRefresh(ctx);
}
function sgSetPeerType(ctx, i, v){
  const r = sgRulesOf(ctx)[i];
  r.srcType = v;
  r.src = v === '任何位置-IPv4' ? '0.0.0.0/0' : v === '我的 IP' ? '203.0.113.10/32' : '';
  sgRefresh(ctx);
}
function sgAddRule(ctx){ sgRulesOf(ctx).push(sgBlank()); sgRefresh(ctx); }
function sgDelRule(ctx, i){ sgRulesOf(ctx).splice(i, 1); sgRefresh(ctx); }
/* 校验并清洗：完全空白的「自定义」行直接丢弃；填了一半的行报错 */
function sgClean(rules){
  const out = [];
  for (const r of rules) {
    const t = SG_TYPES[r.type];
    const blank = !t.fixed && !String(r.port).trim() && !String(r.src).trim();
    if (r.isNew && blank) continue;
    if (!t.fixed && !String(r.port).trim()) { toast('请填写端口范围'); return null; }
    if (!String(r.src).trim()) { toast('请填写源 / 目标'); return null; }
    out.push(r);
  }
  return out;
}

function toggleDevUser(user){
  if (!state.devOpen) state.devOpen = {};

  state.devOpen[user] = state.devOpen[user] === false ? true : false;
  renderApp();
}
function deviceActions(d){
  const lk = (txt, js, danger) => `<button class="btn link"${danger ? ' style="color:var(--danger)"' : ''} onclick="event.stopPropagation();${js}">${txt}</button>`;
  /* 操作列固定两个槽位 + min-width，避免待认证（认证/忽略）与其他状态之间版面跳动 */
  const ph = '<span class="btn link" style="visibility:hidden" aria-hidden="true">忽略</span>';
  const wrap = h => `<div style="display:inline-flex;align-items:center;gap:4px;min-width:120px">${h}</div>`;
  const args = `'${d.user}','${d.mac}','${d.id}'`;
  const admin = isAdmin();
  const mine = d.user === sessionUserName();

  if (!admin) {
    /* 浏览者只读；运维员仅对自己已认证设备可吊销 */
    if (isViewer()) return wrap('<span class="muted">—</span>');
    if (d.status === '已认证' && mine) {
      return wrap(lk('吊销', `confirmDeviceOp('吊销',${args},'已吊销','已吊销设备')`, true) + ph);
    }
    /* 待认证 / 已吊销 / 已忽略：非管理员无操作 */
    return wrap('<span class="muted">—</span>');
  }
  /* 已吊销：列表无操作（重新认证走接入页） */
  if (d.status === '待认证') return wrap(
    lk('认证', `confirmDeviceOp('认证',${args},'已认证','已认证设备')`) +
    lk('忽略', `confirmDeviceOp('忽略',${args},'已忽略','已忽略设备')`)
  );
  if (d.status === '已认证') return wrap(
    lk('吊销', `confirmDeviceOp('吊销',${args},'已吊销','已吊销设备')`, true) + ph
  );
  if (d.status === '已忽略') return wrap(
    lk('认证', `confirmDeviceOp('认证',${args},'已认证','已认证设备')`) + ph
  );
  return wrap('<span class="muted">—</span>');
}

      const isFirst = i === 0;

        ? (multi

function auditCell(k, v){
  if (v === '' || v == null || v === '—') return '<span class="muted">—</span>';
  if (k === 'result' || k === 'accessResult') {
    const ok = v === '成功';
    const warn = v === '未知';
    return `<span class="tag ${ok ? 'ok' : warn ? 'warn' : 'bad'}">${v}</span>`;
  }
  if (k === 'level') return `<span class="tag ${v === '紧急' ? 'bad' : v === '重要' ? 'warn' : 'blue'}">${v}</span>`;
  if (k === 'status') return `<span class="tag ${v === '未处理' ? 'bad' : v === '已关闭' ? '' : 'blue'}">${v}</span>`;
  if (k === 'overreach') return `<span class="tag ${v === '是' ? 'bad' : 'ok'}">${v}</span>`;
  if (k === 'opsSummary' || k === 'cmd' || k === 'summary') return `<span style="font-size:12px">${escHtml(v)}</span>`;
  return escHtml(v);
}

function setAuditResView(v){
  state.auditResView = v;
  renderApp();
}
function openAccessDetail(id){
  openDrawer('audit-detail', { tab: 'res', accessId: id });
}
function accessSessionOf(id){
  return ACCESS_SESSIONS.find(x => x.id === id);
}

function renderAccessTimeline(s){
  return (s.timeline || []).map(ev => {
    const dot = ev.kind === 'bad' ? 'bad' : ev.kind === 'warn' ? 'warn' : ev.kind === 'ok' ? 'ok' : '';
    const body = ev.fold
      ? `<details class="tl-card${ev.focus ? ' focus' : ''}"><summary>${escHtml(ev.title)} · ${ev.lines.length} 条</summary>${ev.lines.map(l => `<div class="q-line">${escHtml(l)}</div>`).join('')}</details>`
      : `<div class="tl-card${ev.focus ? ' focus' : ''}"><div class="tl-h">${escHtml(ev.title)}</div><div class="tl-d">${ev.d || ''}</div></div>`;
    return `<div class="tl-item"><div class="tl-time">${ev.t}</div><div class="tl-rail"><div class="tl-dot ${dot}"></div></div>${body}</div>`;
  }).join('');
}
