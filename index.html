  const sel = tab === 'alert'
    ? ['全部状态', '未处理', '已确认', '处理中', '已关闭']
    : ['全部结果', '成功', '失败', '阻断'];
  const titleSub = tab === 'sys' ? '<div class="pg-sub">零信任云平台应用自身日志</div>' : '';
  const notes = {
    sys: ['系统日志 = 零信任云平台应用自身日志（Agent / 平台接口等）；「日志来源」必填。计划任务主记录在此，访问日志「自动任务」可联合查看。'],
    app: ['应用日志 = 用户在平台控制台做了什么（含签名认证 / 审批、设备认证申请等）。列表列：时间、类别、操作者、对象名称、事件、结果。'],
    alert: [
      '告警日志仅含两类：① <b>策略执行</b>结果（放行/拒绝/阻断）；② 对接云厂商同步的告警，来源展示为「云资源告警」（本原型示例为 AWS GuardDuty）。',
      '设备认证申请等属应用操作，记在应用日志，不进告警。无「建议动作」。',
    ],
  }[tab].concat(['<b>数据范围</b>：有审计功能权限即可看全量日志（运维员与管理员相同）；浏览者无审计菜单。', '点击行打开右侧详情；命令 / 接口摘要已脱敏。', '时间段筛选最长一周。']);
  return `<div class="card stack">
    <div class="row between"><div><div class="pg-title">${AUDIT_TAB_NAME[tab]}</div>${titleSub}</div><span class="muted">共 ${rows.length} 条（示例）</span></div>
    <div class="row" style="flex-wrap:wrap">
      <input class="ctl" placeholder="关键词" style="width:180px">
      <select class="ctl">${sel.map(o => `<option>${o}</option>`).join('')}</select>
      ${auditRangeFilter()}
    </div>
    <div style="overflow-x:auto">
      <table style="min-width:${tab === 'alert' ? 1080 : 960}px">
        <thead><tr>${cols.map(c => `<th style="white-space:nowrap">${c[1]}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map((r, i) => `<tr style="cursor:pointer" onclick="openDrawer('audit-detail',{tab:'${tab}',i:${i}})">
            ${cols.map(c => `<td${c[0] === 'time' || c[0] === 'result' ? ' style="white-space:nowrap"' : ''}>${auditCell(c[0], r[c[0]])}</td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${note(notes)}
  </div>`;
}

/* 抽屉：应用/告警/系统 = 字段详情；访问 = 一次访问时间线 */
function auditDetailBody(p){
  if (p && p.tab === 'res') {
    const s = accessSessionOf(p.accessId) || ACCESS_SESSIONS[0];
    const alerts = (s.alerts || []).map(a =>
      `<div class="row" style="gap:8px;margin-top:6px"><span class="tag ${a.level === '紧急' ? 'bad' : 'warn'}">${a.level}</span><span>${escHtml(a.title)}</span><span class="muted">${a.id}</span></div>`
    ).join('') || '<div class="muted" style="margin-top:6px">无关联告警</div>';
    return `
      <div class="hd-sec-t">访问摘要</div>
      <div class="kv" style="grid-template-columns:110px 1fr">
        <div class="k">访问 ID</div><div>${escHtml(s.id)}</div>
        <div class="k">操作者</div><div>${auditCell('actor', s.actor)}${s.noPlatform ? ' <span class="tag warn">无平台接入会话</span>' : ''}</div>
        <div class="k">主机</div><div>${escHtml(s.host)} · 登录账号 ${escHtml(s.loginUser)}</div>
        <div class="k">入口</div><div>${escHtml(s.entry)}</div>
        <div class="k">接入结果</div><div>${auditCell('accessResult', s.accessResult)}</div>
        <div class="k">期间操作</div><div>${escHtml(s.opsSummary)}</div>
        <div class="k">开始 / 结束</div><div>${escHtml(s.start)} → ${escHtml(s.end)} · ${escHtml(s.endReason)}</div>
        <div class="k">是否越权</div><div>${auditCell('overreach', s.overreach)}</div>
        <div class="k">命中策略</div><div>${escHtml(s.policy)}</div>
        <div class="k">设备信任</div><div>${escHtml(s.deviceTrusted)}</div>
      </div>
      <div class="hd-sec-t" style="margin-top:18px">时间线</div>
      <div>${renderAccessTimeline(s)}</div>
      <div class="hd-sec-t" style="margin-top:18px">关联告警</div>
      ${alerts}
      <div class="hd-sec-t" style="margin-top:18px">完整性</div>
      <div class="sub" style="line-height:1.6">${escHtml(s.integrity)}</div>
      <div class="tiny" style="margin-top:12px">命令参数已脱敏；普通查询可折叠，重点操作保持展开。</div>`;
  }
  const tab = (p && AUDIT_COLS[p.tab]) ? p.tab : 'sys';
  const r = (AUDIT_ROWS[tab] || [])[p && p.i] || AUDIT_ROWS[tab][0];
  const cols = AUDIT_COLS[tab];
  return `<div class="hd-sec-t">基本信息 <span class="muted" style="font-weight:400">· ${AUDIT_TAB_NAME[tab]}</span></div>
    <div class="kv" style="grid-template-columns:110px 1fr">
      ${cols.map(c => `<div class="k">${c[1]}</div><div>${auditCell(c[0], r[c[0]])}</div>`).join('')}
    </div>
    <div class="hd-sec-t" style="margin-top:18px">更多字段</div>
    <div class="kv" style="grid-template-columns:110px 1fr">
      ${(r.extra || []).map(e => `<div class="k">${e[0]}</div><div>${escHtml(e[1])}</div>`).join('') || '<div class="k">—</div><div class="muted">无</div>'}
    </div>
    <div class="hd-sec-t" style="margin-top:18px">原日志信息</div>
    <pre class="log-pre">${escHtml(JSON.stringify(r.raw || {}, null, 2))}</pre>
    <div class="tiny">命令、接口摘要等已按脱敏规则处理（参数中的密码 / 令牌显示为「[已隐藏]」）。</div>`;
}

/* ---------- 审计 · 远程会话回放 ---------- */
const REPLAYS = [
  { id: 'rp-1', time: '11-18 17:03', user: 'Vivi', host: 'web-prod-01', dur: '12 分 08 秒', status: '已结束' },
  { id: 'rp-2', time: '11-18 14:20', user: 'Lin', host: 'pay-api-02', dur: '35 分 41 秒', status: '空闲超时' },
  { id: 'rp-3', time: '11-17 18:45', user: 'Lin', host: 'web-prod-01', dur: '04 分 52 秒', status: '管理员强制断开' },
];
function vSessionReplay(){
  return `<div class="card stack">
    <div class="row between"><span class="pg-title">远程会话回放</span><span class="muted">共 ${REPLAYS.length} 条（示例）</span></div>
    <div class="row" style="flex-wrap:wrap">
      <input class="ctl" placeholder="搜索用户 / 主机" style="width:180px">
      ${auditRangeFilter()}
    </div>
    <table>
      <thead><tr><th>时间</th><th>用户</th><th>主机</th><th>时长</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        ${REPLAYS.map(r => `<tr>
          <td>${r.time}</td><td>${r.user}</td><td>${r.host}</td><td>${r.dur}</td>
          <td><span class="tag ${r.status === '已结束' ? 'ok' : 'warn'}">${r.status}</span></td>
          <td><button class="btn link" onclick="openReplay('${r.id}')">回放</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    ${note([
      '回放为敏感内容查看：每次回放会写入应用日志（audit.replay），并与命令日志分开授权。',
      '本期录像为占位示意：不录原始输入，仅展示终端可见输出。',
    ])}
  </div>`;
}
function openReplay(id){
  const r = REPLAYS.find(x => x.id === id);
  if (!r) return;
  openReplay._playing = false;
  document.getElementById('overlay').innerHTML = `
    <div class="mask" onclick="if(event.target.classList.contains('mask')) closeQr()">
      <div class="modal" style="width:720px;max-width:94vw">
        <div class="row between" style="margin-bottom:12px">
          <h2 style="font-size:16px;margin:0">远程会话回放 · ${r.host}</h2>
          <button class="drawer-close" onclick="closeQr()" aria-label="关闭">×</button>
        </div>
        <div class="muted" style="margin-bottom:10px">${r.time} · 用户 ${r.user} · 时长 ${r.dur} · ${r.status}</div>
        <div class="term" style="min-height:260px;display:grid;place-items:center;text-align:center">
          <div><div style="font-size:36px">▶</div><div class="dim" style="margin-top:6px">视频占位（原型）</div>
            <div class="dim">${r.host} · ${r.user} · 终端可见输出回放</div></div>
        </div>
        <div class="row" style="margin-top:12px;flex-wrap:nowrap">
          <button class="btn sm" id="rpPlay" onclick="replayToggle()">▶ 播放</button>
          <input type="range" min="0" max="100" value="0" style="flex:1" oninput="toast('跳转到 '+this.value+'%（原型演示）')">
          <select class="ctl" style="height:28px" onchange="toast('倍速：'+this.value)"><option>1x</option><option>1.5x</option><option>2x</option><option>4x</option></select>
          <button class="btn sm" onclick="toast('已进入全屏（原型演示）')">全屏</button>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeQr()">关闭</button></div>
      </div>
    </div>`;
  toast('已记录一次回放访问（audit.replay）');
}
function replayToggle(){
  openReplay._playing = !openReplay._playing;
  const b = document.getElementById('rpPlay');
  if (b) b.textContent = openReplay._playing ? '⏸ 暂停' : '▶ 播放';
  toast(openReplay._playing ? '开始播放（原型演示）' : '已暂停');
}

/* ---------- QR (仅终止主机 / 删 VPC) ---------- */
let qrPending = null;
function qrConfirm(action, onOk){
  qrPending = typeof onOk === 'function' ? onOk : null;
  document.getElementById('overlay').innerHTML = `
    <div class="mask" onclick="if(event.target.classList.contains('mask')) closeQr()">
      <div class="modal sign-modal" role="dialog" aria-labelledby="signTitle">
        <div class="sign-bar">
          <span class="sign-back">‹ 确认</span>
          <button class="drawer-close" onclick="closeQr()" aria-label="关闭">×</button>
        </div>
        <div class="sign-phone">
          <div class="sign-notch"></div>
          <div class="sign-screen">
            <div class="sign-ghost"></div>
            <div class="sign-ghost short"></div>
            <div class="sign-card">
              <div class="sign-card-t"><span class="sign-bang">!</span><span>Please confirm that you wish to proceed with this transaction.</span></div>
              <div class="sign-acts">
                <button type="button" class="sign-cancel" onclick="closeQr()">Cancel</button>
                <button type="button" class="sign-ok" onclick="confirmQr()">Confirm</button>
              </div>
            </div>
          </div>
        </div>
        <div class="sign-h" id="signTitle">请在手机 App 中确认本次请求</div>
        <div class="sign-sub">确认弹窗已发送到你的手机，请打开手机查看。</div>
      </div>
    </div>`;
}
function confirmQr(){
  const fn = qrPending;
  closeQr();
  if (typeof fn === 'function') fn();
}
function closeQr(){
  clearIdleExitTimer();
  qrPending = null;
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.innerHTML = '';
}

/* ---------- 认证当前设备（管理员 / 运维员统一入口） ---------- */
function openDeviceCert(){
  document.getElementById('overlay').innerHTML = `
    <div class="mask" onclick="if(event.target.classList.contains('mask')) closeQr()">
      <div class="modal">
        <h2 style="margin:0 0 8px">认证当前设备</h2>
        <div class="sub" style="line-height:1.7">为保证业务安全可信，该设备将通过管理员认证为可信设备，若您确认将该设备默认为日常工作设备，请通过 HiBro 手机端扫码确认并提交认证申请</div>
        <div class="qr"></div>
        <div class="row" style="justify-content:flex-end;margin-top:16px">
          <button class="btn" onclick="closeQr()">取消</button>
          <button class="btn primary" onclick="confirmDeviceCert()">已扫码确认</button>
        </div>
      </div>
    </div>`;
}
function confirmDeviceCert(){
  closeQr();
  state.deviceCertSent = true;
  toast('已发送管理员，若认证成功可接入零信任防护网络', 3200);
  if (document.getElementById('ztNav')) renderApp();
}

showApps();
</script>
